                    <!-- Step 3: Generate Match Rules (Only for Unify route) -->
                    <template lwc:elseif={isStep3}>
                        <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_medium" role="alert">
                            <div class="slds-notify__content">
                                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                                <p><strong>We recommend this based on your data profile</strong> — AI analyzed your data patterns and will generate rules that optimize match quality for your specific dataset.</p>
                            </div>
                        </div>

                        <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_large">
                            <lightning-badge label="Optional" variant="warning"></lightning-badge>
                            <p class="slds-text-body_small slds-m-top_x-small">
                                Select the type of rule you want to make, review the rules in the box below and click "Create Ruleset". You can always do this later or make your custom rules by immediately clicking "Create Ruleset".
                            </p>
                        </div>

                        <h3 class="slds-text-heading_small slds-m-bottom_medium">Choose Match Strategy</h3>
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={conservativeCardClass} data-strategy="conservative" onclick={handleStrategySelect}>
                                    <template lwc:if={isConservativeSelected}>
                                        <div class="visual-picker-checkmark">
                                            <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                        </div>
                                    </template>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                            Conservative
                                            <lightning-badge label="Recommended" class="slds-m-left_x-small"></lightning-badge>
                                        </h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Match only profiles with high degree of similarity. Lowest risk of incorrect matches.</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={typicalCardClass} data-strategy="typical" onclick={handleStrategySelect}>
                                    <template lwc:if={isTypicalSelected}>
                                        <div class="visual-picker-checkmark">
                                            <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                        </div>
                                    </template>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Typical</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Balanced approach with moderate similarity thresholds. Good for most use cases.</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={looseCardClass} data-strategy="loose" onclick={handleStrategySelect}>
                                    <template lwc:if={isLooseSelected}>
                                        <div class="visual-picker-checkmark">
                                            <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                        </div>
                                    </template>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Loose</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Match profiles with lower similarity. Higher recall but increased risk of false matches.</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="3" padding="around-small">
                                <div class={customCardClass} data-strategy="custom" onclick={handleStrategySelect}>
                                    <template lwc:if={isCustomSelected}>
                                        <div class="visual-picker-checkmark">
                                            <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                        </div>
                                    </template>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Custom</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Create your own match rules from scratch without AI recommendations.</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>

                        <!-- Recommended Match Rules (shown for Conservative, Typical, Loose) -->
                        <template lwc:if={showRecommendedRules}>
                            <lightning-card title={recommendedRulesTitle} class="slds-m-top_large">
                                <div class="slds-p-around_medium">
                                    <template for:each={matchRules} for:item="rule">
                                        <div key={rule.id} class="slds-m-bottom_medium">
                                            <div class="slds-grid slds-grid_vertical-align-start">
                                                <template lwc:if={rule.showOr}>
                                                    <div class="slds-col slds-size_1-of-12 slds-text-align_center slds-p-top_small">
                                                        <span class="slds-badge slds-badge_lightest">or</span>
                                                    </div>
                                                </template>
                                                <template lwc:else>
                                                    <div class="slds-col slds-size_1-of-12"></div>
                                                </template>
                                                <div class="slds-col slds-size_11-of-12">
                                                    <div class="slds-box slds-box_x-small">
                                                        <h4 class="slds-text-body_regular slds-text-color_default"><strong>{rule.title}</strong></h4>
                                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{rule.description}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </lightning-card>
                        </template>

                        <!-- Custom Rules Message -->
                        <template lwc:if={isCustomSelected}>
                            <div class="slds-box slds-box_x-small slds-theme_shade slds-text-align_center slds-p-around_large slds-m-top_large">
                                <lightning-icon icon-name="utility:add" size="medium" class="slds-m-bottom_small"></lightning-icon>
                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">Create Custom Match Rules</h3>
                                <p class="slds-text-body_small slds-text-color_weak">Click "Create Ruleset" to proceed and define your custom matching criteria in the rule builder.</p>
                            </div>
                        </template>
                    </template>
