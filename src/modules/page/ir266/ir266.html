<template>
    <div class="slds-grid slds-wrap">
        <!-- Side Navigation -->
        <div class="slds-col slds-size_1-of-6 slds-p-right_small" lwc:if={showSideNav}>
            <div class="slds-box slds-box_x-small slds-theme_shade">
                <lightning-input
                    type="search"
                    label="Quick Find"
                    variant="label-hidden"
                    placeholder="Quick Find"
                    class="slds-m-bottom_small">
                </lightning-input>

                <nav class="slds-nav-vertical" aria-label="Sub page">
                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title slds-text-title_caps">Connect & Unify</h2>
                        <ul>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Streams</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Lake Objects</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Transforms</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Model</a>
                            </li>
                            <li class="slds-nav-vertical__item slds-is-active">
                                <a href="#" class="slds-nav-vertical__action" aria-current="page">Identity Resolutions</a>
                            </li>
                        </ul>
                    </div>
                </nav>

                <lightning-button
                    label="Collapse"
                    icon-name="utility:back"
                    icon-position="left"
                    variant="neutral"
                    class="slds-m-top_small slds-button_stretch"
                    onclick={handleCollapseSideNav}>
                </lightning-button>
            </div>
        </div>

        <!-- Expand Button (when collapsed) -->
        <template lwc:if={showSideNav}>
            <template lwc:if={false}></template>
        </template>
        <template lwc:else>
            <div class="slds-col slds-size_1-of-12 slds-p-right_small">
                <lightning-button
                    icon-name="utility:forward"
                    variant="neutral"
                    title="Expand Navigation"
                    onclick={handleExpandSideNav}>
                </lightning-button>
            </div>
        </template>

        <!-- Step Navigation -->
        <div class="slds-col slds-size_2-of-12 slds-p-horizontal_small">
            <div class="slds-box slds-box_x-small">
                <h2 class="slds-text-heading_small slds-m-bottom_xx-small">Identity Resolution</h2>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Sequential guided experience</p>

                <nav class="slds-nav-vertical" aria-label="Steps">
                    <!-- Pre-configuration -->
                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title slds-text-title_caps slds-text-color_brand">Setup</h2>
                        <ul>
                            <li class={preConfigClass} data-step="0" onclick={handleStepClick}>
                                <a href="javascript:void(0);" class="slds-nav-vertical__action">
                                    <lightning-icon icon-name="utility:settings" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="slds-truncate">Pre-Configuration</span>
                                </a>
                            </li>
                            <li class={routeSelectionClass} data-step="1" onclick={handleStepClick}>
                                <a href="javascript:void(0);" class="slds-nav-vertical__action">
                                    <lightning-icon icon-name="utility:choice" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="slds-truncate">Create New Ruleset</span>
                                </a>
                            </li>
                        </ul>
                    </div>

                    <!-- Configuration Steps (shown after route selection) -->
                    <template lwc:if={selectedRoute}>
                        <div class="slds-nav-vertical__section slds-border-top slds-m-top_small">
                            <h2 class="slds-nav-vertical__title slds-text-title_caps slds-text-color_brand">Configuration</h2>
                            <ul>
                                <li class={step1Class} data-step="2" onclick={handleStepClick}>
                                    <a href="javascript:void(0);" class="slds-nav-vertical__action">
                                        <lightning-badge label="1" class="slds-m-right_x-small"></lightning-badge>
                                        <span class="slds-truncate">Select Unification Type</span>
                                    </a>
                                </li>
                                <li class={step2Class} data-step="3" onclick={handleStepClick}>
                                    <a href="javascript:void(0);" class="slds-nav-vertical__action">
                                        <lightning-badge label="2" class="slds-m-right_x-small"></lightning-badge>
                                        <span class="slds-truncate">Basic Details</span>
                                    </a>
                                </li>
                                <li class={step3Class} data-step="4" onclick={handleStepClick}>
                                    <a href="javascript:void(0);" class="slds-nav-vertical__action">
                                        <lightning-badge label="3" class="slds-m-right_x-small"></lightning-badge>
                                        <span class="slds-truncate">{step3Label}</span>
                                        <template lwc:if={step3Required}>
                                            <lightning-badge label="Required" variant="error" class="slds-m-left_x-small"></lightning-badge>
                                        </template>
                                        <template lwc:else>
                                            <lightning-badge label="Optional" variant="warning" class="slds-m-left_x-small"></lightning-badge>
                                        </template>
                                    </a>
                                </li>
                                <template lwc:if={showStep4}>
                                    <li class={step4Class} data-step="5" onclick={handleStepClick}>
                                        <a href="javascript:void(0);" class="slds-nav-vertical__action">
                                            <lightning-badge label="4" class="slds-m-right_x-small"></lightning-badge>
                                            <span class="slds-truncate">Generate Match Rules</span>
                                        </a>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </nav>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="slds-col slds-size_7-of-12 slds-p-horizontal_small">
            <lightning-card>
                <h1 slot="title" class="slds-text-heading_medium">{currentStepTitle}</h1>
                <p slot="subtitle">{currentStepSubtitle}</p>

                <div class="slds-p-around_medium">
                    <!-- Pre-Configuration: DMO, Mappings, Data Quality -->
                    <template lwc:if={isPreConfig}>
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Data Model Objects (DMO)</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Configure your data model objects before creating rulesets</p>
                                <div class="slds-box slds-box_x-small slds-theme_success">
                                    <lightning-icon icon-name="utility:success" size="small" variant="success" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="slds-text-body_regular">5 DMOs configured and ready</span>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Field Mappings</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Ensure all required fields are properly mapped</p>
                                <div class="slds-box slds-box_x-small slds-theme_success">
                                    <lightning-icon icon-name="utility:success" size="small" variant="success" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="slds-text-body_regular">94% mapping coverage across all sources</span>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Data Quality Validation</h3>
                                <lightning-layout>
                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_success">
                                            <div class="slds-text-heading_small">1.2M</div>
                                            <div class="slds-text-body_small">Records Scanned</div>
                                        </div>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_success">
                                            <div class="slds-text-heading_small">98%</div>
                                            <div class="slds-text-body_small">PartyId Complete</div>
                                        </div>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_success">
                                            <div class="slds-text-heading_small">5</div>
                                            <div class="slds-text-body_small">Data Sources</div>
                                        </div>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-layout-item>

                            <lightning-layout-item size="12">
                                <div class="slds-notify slds-notify_toast slds-theme_success" role="status">
                                    <div class="slds-notify__content">
                                        <h2 class="slds-text-heading_small">
                                            <lightning-icon icon-name="utility:success" size="small" class="slds-m-right_x-small"></lightning-icon>
                                            All pre-configuration checks passed! You're ready to create a ruleset.
                                        </h2>
                                    </div>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>

                    <!-- Route Selection: Choose How to Create Ruleset -->
                    <template lwc:elseif={isRouteSelection}>
                        <div class="slds-text-longform slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">How do you want to create your identity resolution ruleset?</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Choose the approach that fits your needs</p>
                        </div>

                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="4" padding="around-small">
                                <article class="slds-card route-card" data-route="unify" onclick={handleRouteSelect} style="cursor: pointer;">
                                    <div class="slds-card__body slds-card__body_inner slds-text-align_center slds-p-around_medium">
                                        <lightning-icon icon-name="standard:merge" size="large" class="slds-m-bottom_small"></lightning-icon>
                                        <h3 class="slds-text-heading_medium slds-m-bottom_small">Unify Unmatched Records</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Create new match rules to consolidate duplicate records</p>
                                        <lightning-badge label="Recommended" class="slds-m-top_small"></lightning-badge>
                                    </div>
                                </article>
                            </lightning-layout-item>

                            <lightning-layout-item size="4" padding="around-small">
                                <article class="slds-card route-card" data-route="mdm" onclick={handleRouteSelect} style="cursor: pointer;">
                                    <div class="slds-card__body slds-card__body_inner slds-text-align_center slds-p-around_medium">
                                        <lightning-icon icon-name="standard:data_integration_hub" size="large" class="slds-m-bottom_small"></lightning-icon>
                                        <h3 class="slds-text-heading_medium slds-m-bottom_small">Import MDM</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Import pre-existing rulesets from Master Data Management systems</p>
                                    </div>
                                </article>
                            </lightning-layout-item>

                            <lightning-layout-item size="4" padding="around-small">
                                <article class="slds-card route-card" data-route="datakit" onclick={handleRouteSelect} style="cursor: pointer;">
                                    <div class="slds-card__body slds-card__body_inner slds-text-align_center slds-p-around_medium">
                                        <lightning-icon icon-name="standard:dataset" size="large" class="slds-m-bottom_small"></lightning-icon>
                                        <h3 class="slds-text-heading_medium slds-m-bottom_small">Import from Data Kits</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Use pre-configured ruleset templates from Salesforce Data Kits</p>
                                    </div>
                                </article>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>

                    <!-- Step 1: Select Unification Type -->
                    <template lwc:elseif={isStep1}>
                        <div class="slds-text-longform slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">What records will this ruleset consolidate?</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Choose the entity type you want to create unified records for</p>
                        </div>

                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="4" padding="around-small">
                                <lightning-card>
                                    <div class="slds-text-align_center slds-p-around_medium" style="cursor: pointer;">
                                        <lightning-icon icon-name="standard:person_account" size="large" class="slds-m-bottom_small"></lightning-icon>
                                        <h3 class="slds-text-heading_medium">Individual</h3>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">Create unified person profiles across your data sources</p>
                                    </div>
                                </lightning-card>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small">
                                <lightning-card>
                                    <div class="slds-text-align_center slds-p-around_medium" style="cursor: pointer;">
                                        <lightning-icon icon-name="standard:account" size="large" class="slds-m-bottom_small"></lightning-icon>
                                        <h3 class="slds-text-heading_medium">Account</h3>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">Create unified business/company profiles</p>
                                    </div>
                                </lightning-card>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small">
                                <lightning-card>
                                    <div class="slds-text-align_center slds-p-around_medium" style="cursor: pointer;">
                                        <lightning-icon icon-name="standard:household" size="large" class="slds-m-bottom_small"></lightning-icon>
                                        <h3 class="slds-text-heading_medium">Household</h3>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">Group individuals into household units</p>
                                    </div>
                                </lightning-card>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>

                    <!-- Step 2: Basic Details -->
                    <template lwc:elseif={isStep2}>
                        <lightning-card title="Ruleset Configuration">
                            <div class="slds-p-around_medium">
                                <lightning-input
                                    label="Ruleset Name"
                                    placeholder="e.g., Individual IR - Production"
                                    required
                                    class="slds-m-bottom_medium">
                                </lightning-input>

                                <lightning-input
                                    label="Ruleset ID"
                                    placeholder="Auto-generated or custom ID"
                                    class="slds-m-bottom_medium">
                                </lightning-input>

                                <lightning-combobox
                                    label="Match Primary DMO Records"
                                    placeholder="Select a primary DMO object"
                                    options={dmoOptions}
                                    required
                                    class="slds-m-bottom_medium">
                                </lightning-combobox>

                                <lightning-textarea
                                    label="Description"
                                    placeholder="Describe the purpose and scope of this ruleset..."
                                    field-level-help="Add details about what this ruleset will accomplish"
                                    class="slds-m-bottom_medium">
                                </lightning-textarea>
                            </div>
                        </lightning-card>
                    </template>

                    <!-- Step 3: Trusted Sources (Optional for Unify, Required for MDM) -->
                    <template lwc:elseif={isStep3}>
                        <lightning-card title="Trusted Data Sources">
                            <div class="slds-p-around_medium">
                                <template lwc:if={step3Required}>
                                    <div class="slds-notify slds-notify_toast slds-theme_warning slds-m-bottom_medium" role="status">
                                        <div class="slds-notify__content">
                                            <p><strong>Required for MDM import</strong> — You must select a Data Lake Object for 7 DMOs as trusted sources.</p>
                                        </div>
                                    </div>
                                </template>

                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                                    Designate specific sources as authoritative for certain attributes. When conflicts arise, trusted sources always win.
                                </p>

                                <lightning-combobox
                                    label="Select Data Lake Object for Trusted Sources"
                                    placeholder="Choose a Data Lake Object"
                                    options={dloOptions}
                                    class="slds-m-bottom_medium">
                                </lightning-combobox>

                                <div class="slds-box slds-box_x-small slds-theme_shade slds-text-align_center slds-p-around_medium">
                                    <p class="slds-text-body_small slds-text-color_weak">Additional trusted source configuration will appear after selection</p>
                                </div>
                            </div>
                        </lightning-card>
                    </template>

                    <!-- Step 4: Generate Match Rules (Only for Unify route) -->
                    <template lwc:elseif={isStep4}>
                        <lightning-card title="Match Rule Configuration">
                            <div class="slds-p-around_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Choose Your Approach</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                                    Generate AI-powered match rules based on your data, or create custom rules manually
                                </p>

                                <lightning-radio-group
                                    label="Match Rule Strategy"
                                    options={strategyOptions}
                                    value="typical"
                                    type="button"
                                    class="slds-m-bottom_medium">
                                </lightning-radio-group>

                                <div class="slds-box slds-box_x-small slds-m-bottom_medium">
                                    <p class="slds-text-body_small"><strong>Typical Match Rules:</strong> Balanced precision and recall. Recommended for most use cases with moderate tolerance for false positives.</p>
                                </div>

                                <div class="slds-m-top_large">
                                    <lightning-button
                                        label="Create Custom Match Rules"
                                        variant="neutral"
                                        icon-name="utility:add"
                                        class="slds-m-right_small">
                                    </lightning-button>
                                    <span class="slds-text-body_small slds-text-color_weak">Advanced: Define your own matching criteria</span>
                                </div>

                                <!-- Preview Results -->
                                <div class="slds-m-top_large">
                                    <h3 class="slds-text-heading_small slds-m-bottom_small">Preview Results</h3>
                                    <div class="slds-notify slds-notify_toast slds-theme_info slds-m-bottom_medium" role="status">
                                        <div class="slds-notify__content">
                                            <p>Preview reflects your selected strategy — these numbers show projected unification results</p>
                                        </div>
                                    </div>

                                    <lightning-layout>
                                        <lightning-layout-item size="4" padding="around-small">
                                            <div class="slds-box slds-box_x-small slds-text-align_center">
                                                <div class="slds-text-heading_large">1.2M</div>
                                                <div class="slds-text-body_small slds-text-color_weak">Source rows</div>
                                            </div>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="4" padding="around-small">
                                            <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                                                <div class="slds-text-heading_large slds-text-color_brand">847K</div>
                                                <div class="slds-text-body_small slds-text-color_weak">Unified profiles</div>
                                            </div>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="4" padding="around-small">
                                            <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                                                <div class="slds-text-heading_large slds-text-color_brand">29%</div>
                                                <div class="slds-text-body_small slds-text-color_weak">Consolidation</div>
                                            </div>
                                        </lightning-layout-item>
                                    </lightning-layout>
                                </div>
                            </div>
                        </lightning-card>
                    </template>
                </div>

                <!-- Footer -->
                <div slot="footer" class="slds-grid slds-grid_align-spread">
                    <lightning-button
                        label="Back"
                        variant="neutral"
                        onclick={handleBack}
                        disabled={currentStep === 0}>
                    </lightning-button>

                    <!-- Credit Consumption Indicator -->
                    <div class="slds-text-body_small slds-align-middle">
                        <span class="slds-text-color_weak">Estimated credits: </span>
                        <strong class="slds-text-color_brand">{estimatedCredits}</strong>
                        <lightning-button-icon
                            icon-name="utility:info"
                            variant="bare"
                            alternative-text="View credit breakdown"
                            title="View credit breakdown"
                            class="slds-m-left_xx-small"
                            onclick={handleShowCreditBreakdown}>
                        </lightning-button-icon>
                    </div>

                    <template lwc:if={showNextButton}>
                        <lightning-button
                            label={nextButtonLabel}
                            variant="brand"
                            onclick={handleNext}>
                        </lightning-button>
                    </template>
                </div>
            </lightning-card>
        </div>

        <!-- Chat Panel (Docked Composer) -->
        <div class="slds-col slds-size_3-of-12 slds-p-left_small" lwc:if={showChatPanel}>
            <div class="slds-docked-composer slds-grid slds-grid_vertical slds-is-open" style="height: calc(100vh - 8rem);">
                <div class="slds-docked-composer__header slds-grid slds-grid_align-spread slds-shrink-none">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure slds-m-right_x-small">
                            <lightning-icon icon-name="standard:bot" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-truncate" title="D360 Agent SG">D360 Agent SG</h2>
                        </div>
                    </div>
                    <div class="slds-col_bump-left slds-shrink-none">
                        <lightning-button-icon
                            icon-name="utility:close"
                            variant="bare"
                            alternative-text="Close"
                            title="Close"
                            onclick={handleCloseChat}>
                        </lightning-button-icon>
                    </div>
                </div>
                <div class="slds-docked-composer__body slds-col slds-grid slds-grid_vertical slds-nowrap" style="overflow-y: auto;">
                    <div class="slds-p-around_medium">
                        <div class="slds-chat">
                            <ul class="slds-chat-list">
                                <li class="slds-chat-listitem slds-chat-listitem_inbound">
                                    <div class="slds-chat-message">
                                        <div class="slds-chat-message__body">
                                            <div class="slds-chat-message__text slds-chat-message__text_inbound">
                                                <span>Hello! I'm here to help you with Identity Resolution. Complete the pre-configuration checks to get started.</span>
                                            </div>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="slds-docked-composer__footer slds-shrink-none">
                    <div class="slds-p-around_small">
                        <lightning-textarea
                            placeholder="Ask about Identity Resolution..."
                            class="slds-m-bottom_x-small">
                        </lightning-textarea>
                        <lightning-button label="Send" variant="brand" class="slds-float_right"></lightning-button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Action Button (when chat is closed) -->
        <template lwc:if={showChatFab}>
            <div class="chat-fab" onclick={handleOpenChat}>
                <lightning-button-icon
                    icon-name="standard:bot"
