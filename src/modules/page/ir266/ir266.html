<template>
    <!-- Success Notification (Top of Page) -->
    <template lwc:if={showSuccessNotification}>
        <div class="slds-notify_container slds-is-relative" style="position: fixed; top: 0; left: 0; right: 0; z-index: 10000;">
            <div class="slds-notify slds-notify_toast slds-theme_success" role="status">
                <span class="slds-assistive-text">Success</span>
                <span class="slds-icon_container slds-icon-utility-success slds-m-right_small slds-no-flex slds-align-top">
                    <lightning-icon icon-name="utility:success" size="small" variant="inverse" alternative-text="Success"></lightning-icon>
                </span>
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small">{successMessage}</h2>
                </div>
                <div class="slds-notify__close">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        alternative-text="Close"
                        title="Close"
                        onclick={handleCloseNotification}>
                    </lightning-button-icon>
                </div>
            </div>
        </div>
    </template>

    <div class="slds-grid slds-wrap full-height-grid">
        <!-- Side Navigation -->
        <div class="slds-col side-nav-container" lwc:if={showSideNav}>
            <div class="side-nav-content">
                <lightning-input
                    type="search"
                    label="Quick Find"
                    variant="label-hidden"
                    placeholder="Quick Find"
                    class="slds-p-around_medium">
                </lightning-input>

                <nav class="slds-nav-vertical slds-nav-vertical_shade" aria-label="Sub page">
                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:filter" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Connect & Unify</span>
                            <lightning-button-icon
                                icon-name="utility:chevrondown"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                        <ul>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Streams</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Lake Objects</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Transforms</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Model</a>
                            </li>
                            <li class="slds-nav-vertical__item slds-is-active">
                                <a href="#" class="slds-nav-vertical__action" aria-current="page" onclick={handleGoToLandingPage}>Identity Resolution</a>
                            </li>
                        </ul>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:shield" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Govern & Secure</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:transform" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Process & Enrich</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:metrics" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Explore & Optimize</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:graph" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Analyze & Predict</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:clock" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Segment & Act</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>
                </nav>
            </div>

            <div class="side-nav-footer">
                <lightning-button
                    label="Collapse"
                    icon-name="utility:back"
                    icon-position="left"
                    variant="base"
                    class="slds-button_stretch"
                    onclick={handleCollapseSideNav}>
                </lightning-button>
            </div>
        </div>

        <!-- Expand Button (when collapsed) -->
        <template lwc:if={showExpandButton}>
            <div class="slds-col slds-size_1-of-12 slds-p-right_small">
                <lightning-button
                    icon-name="utility:forward"
                    variant="neutral"
                    title="Expand Navigation"
                    onclick={handleExpandSideNav}>
                </lightning-button>
            </div>
        </template>

        <!-- Landing Page Content -->
        <template lwc:if={showLandingPage}>
            <div class="slds-col landing-page-wrapper">
                <div class="landing-page-container">
                    <!-- EOU Guidance Header -->
                    <div class="guidance-header slds-m-bottom_medium">
                        <template lwc:if={guidanceExpanded}>
                            <div class="guidance-header-expanded">
                                <div class="guidance-header-title-row" onclick={handleGuidanceToggle}>
                                    <lightning-icon icon-name="utility:chevrondown" size="x-small" class="chevron-icon"></lightning-icon>
                                    <h2 class="guidance-header-title-expanded">Identity Resolution</h2>
                                </div>
                                <div class="guidance-header-content guidance-header-content--no-card">
                                    <p class="guidance-header-description guidance-header-description--no-card">Configure how customer profiles from different sources are matched and unified into a single identity. Set up match rules, reconciliation logic, and trusted data sources.</p>
                                    <div class="guidance-header-links guidance-header-links--column">
                                        <a href="#" class="guidance-header-link">Identity Resolution Overview <lightning-icon icon-name="utility:new_window" size="xx-small" class="external-icon"></lightning-icon></a>
                                        <a href="#" class="guidance-header-link">Match Rule Best Practices <lightning-icon icon-name="utility:new_window" size="xx-small" class="external-icon"></lightning-icon></a>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="guidance-header-collapsed" onclick={handleGuidanceToggle}>
                                <lightning-icon icon-name="utility:chevronright" size="x-small" class="chevron-icon"></lightning-icon>
                                <h2 class="guidance-header-title-collapsed">Identity Resolution</h2>
                            </div>
                        </template>
                    </div>

                    <!-- Page Header -->
                    <div class="slds-page-header slds-m-bottom_large">
                        <div class="slds-page-header__row">
                            <div class="slds-page-header__col-title">
                                <div class="slds-media">
                                    <div class="slds-media__figure slds-m-right_small">
                                        <lightning-icon icon-name="standard:individual" size="medium"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <p class="header-label">SETUP</p>
                                        <h1 class="custom-header" title="Identity Resolution">Identity Resolution</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Data Quality Card -->
                    <div class={dataQualityCardClass}>
                        <div class="dq-card__inner">
                            <!-- Data Quality Section Header -->
                            <div class="dq-section-header" onclick={handleToggleDataQuality}>
                                <div class="dq-section-header__left">
                                    <lightning-icon
                                        icon-name={dataQualityIcon}
                                        size="x-small"
                                        variant={dataQualityIconVariant}
                                        class="slds-m-right_x-small dq-section-header__icon">
                                    </lightning-icon>
                                    <div>
                                        <h3 class={dataQualityTitleClass}>{dataQualityTitle}</h3>
                                        <p class="dq-section-subtitle slds-text-color_weak">{dataQualitySubtitle}</p>
                                    </div>
                                </div>
                                <lightning-icon
                                    icon-name={dataQualityChevronIcon}
                                    size="x-small"
                                    class="dq-section-header__chevron">
                                </lightning-icon>
                            </div>

                            <!-- Expanded View - Details -->
                            <template lwc:if={dataQualityExpanded}>
                                <div class="slds-m-top_medium">
                                    <template lwc:if={isScenario2}>
                                        <div class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-m-bottom_medium" role="status">
                                            <div class="slds-media__figure">
                                                <lightning-icon icon-name="utility:warning" size="small" alternative-text="Warning"></lightning-icon>
                                            </div>
                                            <div class="slds-media__body">
                                                <p><strong>3 issues require attention</strong> before running Identity Resolution.</p>
                                            </div>
                                        </div>
                                    </template>
                                    <h4 class="slds-text-heading_small slds-m-bottom_medium">{dataQualityExpandedTitle}</h4>
                                    <lightning-layout multiple-rows>
                                        <template for:each={dataQualityMetrics} for:item="metric">
                                            <lightning-layout-item key={metric.id} size="12" class="slds-m-bottom_medium">
                                                <div class="slds-box slds-box_x-small">
                                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                        <div>
                                                            <h5 class="slds-text-body_regular slds-m-bottom_xx-small"><strong>{metric.title}</strong></h5>
                                                            <p class="slds-text-body_small slds-text-color_weak">{metric.description}</p>
                                                        </div>
                                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                            <template lwc:if={metric.icon}>
                                                                <lightning-icon icon-name={metric.icon} size="x-small" variant={metric.iconVariant} class="slds-m-right_x-small"></lightning-icon>
                                                            </template>
                                                            <div class={metric.valueClass}>{metric.value}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </lightning-layout-item>
                                        </template>
                                    </lightning-layout>

                                    <!-- Agentforce Recommendations (V2 only) -->
                                    <template lwc:if={isScenario2}>
                                        <div class="dq-recommendations slds-m-top_large">
                                            <div class="dq-recommendations__header">
                                                <lightning-icon icon-name="utility:einstein" size="x-small" class="slds-m-right_x-small dq-recommendations__icon"></lightning-icon>
                                                <span class="slds-text-heading_small">Agentforce Recommendations</span>
                                            </div>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small slds-m-bottom_medium">Choose how you want to resolve these data quality issues before running Identity Resolution.</p>

                                            <lightning-layout multiple-rows class="slds-gutters_small">
                                                <!-- Option 1: Auto-fix -->
                                                <lightning-layout-item size="6" padding="around-small">
                                                    <div class={autoFixCardClass} data-fix="auto" onclick={handleFixSelect}>
                                                        <template lwc:if={isAutoFixSelected}>
                                                            <div class="visual-picker-checkmark">
                                                                <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                                            </div>
                                                        </template>
                                                        <div class="slds-p-around_medium">
                                                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                                <lightning-icon icon-name="utility:magicwand" size="small" class="slds-m-right_small dq-fix-icon"></lightning-icon>
                                                                <h3 class="slds-text-heading_small">Auto-Fix with AI</h3>
                                                            </div>
                                                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Let Agentforce automatically standardize phone formats, infer missing emails from CRM, and apply default DMO mappings — no manual steps required.</p>
                                                            <ul class="dq-fix-checklist">
                                                                <li>
                                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                                                    <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit</span>
                                                                </li>
                                                                <li>
                                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                                                    <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit</span>
                                                                </li>
                                                                <li>
                                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                                                    <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit</span>
                                                                </li>
                                                            </ul>
                                                        </div>
                                                    </div>
                                                </lightning-layout-item>

                                                <!-- Option 2: Guided fix -->
                                                <lightning-layout-item size="6" padding="around-small">
                                                    <div class={guidedFixCardClass} data-fix="guided" onclick={handleFixSelect}>
                                                        <template lwc:if={isGuidedFixSelected}>
                                                            <div class="visual-picker-checkmark">
                                                                <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                                            </div>
                                                        </template>
                                                        <div class="slds-p-around_medium">
                                                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                                <lightning-icon icon-name="utility:user" size="small" class="slds-m-right_small dq-fix-icon"></lightning-icon>
                                                                <h3 class="slds-text-heading_small">Guided Manual Review</h3>
                                                            </div>
                                                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Walk through each issue step-by-step with Agentforce explaining the problem and your options. You approve every change before it's applied.</p>
                                                            <ul class="dq-fix-checklist">
                                                                <li>
                                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                                                    <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit</span>
                                                                </li>
                                                                <li>
                                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                                                    <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit</span>
                                                                </li>
                                                                <li>
                                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                                                    <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit</span>
                                                                </li>
                                                            </ul>
                                                        </div>
                                                    </div>
                                                </lightning-layout-item>
                                            </lightning-layout>

                                            <template lwc:if={selectedFix}>
                                                <div class="slds-m-top_medium slds-text-align_center">
                                                    <lightning-button
                                                        label={fixButtonLabel}
                                                        variant="brand"
                                                        icon-name="utility:einstein"
                                                        icon-position="left"
                                                        onclick={handleApplyFix}>
                                                    </lightning-button>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Jump in with your first use case -->
                    <div class="jump-in-section slds-m-top_medium">
                        <lightning-layout multiple-rows>
                            <!-- Left: intro text -->
                            <lightning-layout-item size="4" padding="around-medium">
                                <h2 class="slds-text-heading_medium slds-m-bottom_x-small" style="color:#0b5cab;">Start with an IR template</h2>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Pre-configured Identity Resolution rulesets for the most common unification scenarios.</p>
                                <div class="jump-in-bullets slds-m-bottom_medium">
                                    <div class="jump-in-bullet">
                                        <lightning-icon icon-name="utility:list" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                        <span class="slds-text-body_small">Guided setup with recommended match strategies and reconciliation rules.</span>
                                    </div>
                                    <div class="jump-in-bullet slds-m-top_x-small">
                                        <lightning-icon icon-name="utility:refresh" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                        <span class="slds-text-body_small">Customize and re-use templates across rulesets.</span>
                                    </div>
                                </div>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Don't see a template that fits? Describe your use case to the agent and we'll build a ruleset for you.</p>
                                <lightning-button
                                    label="Describe to Agent"
                                    variant="brand"
                                    icon-name="utility:einstein"
                                    icon-position="left">
                                </lightning-button>
                            </lightning-layout-item>
                            <!-- Card: Unify Individual Records -->
                            <lightning-layout-item size="4" padding="around-medium">
                                <div class="jump-in-card">
                                    <div class="jump-in-card__icon">
                                        <lightning-icon icon-name="standard:individual" size="medium"></lightning-icon>
                                    </div>
                                    <h3 class="slds-text-heading_small slds-m-top_small slds-m-bottom_x-small">Unify Individual Records</h3>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Detect and merge duplicate customer profiles across your CRM, marketing, and transactional data sources using name, email, and address matching.</p>
                                </div>
                            </lightning-layout-item>
                            <!-- Card: Import Pre-Matched Profiles -->
                            <lightning-layout-item size="4" padding="around-medium">
                                <div class="jump-in-card">
                                    <div class="jump-in-card__icon">
                                        <lightning-icon icon-name="standard:contact_list" size="medium"></lightning-icon>
                                    </div>
                                    <h3 class="slds-text-heading_small slds-m-top_small slds-m-bottom_x-small">Import Pre-Matched Profiles</h3>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Already unified your customer data in an MDM or external system? Import pre-matched profiles directly into Data Cloud without re-running match logic.</p>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>

                    <!-- Route Selection (hidden once a ruleset has been created) -->
                    <template lwc:if={showCreateRuleset}>
                    <div class="slds-m-top_medium slds-m-bottom_small"></div>
                    <lightning-card>
                        <div class="slds-p-around_medium">
                            <h2 class="slds-text-heading_medium slds-text-align_center slds-m-bottom_small">Don't have a plan in mind yet? Just start below</h2>
                            <p class="slds-text-body_small slds-text-align_center slds-m-bottom_large">Clean and merge your customer data accurately with rulesets - through D360 configurations your own existing setup</p>
                            <lightning-layout multiple-rows>
                                <lightning-layout-item size="4" padding="around-small">
                                    <div class={getRouteCardClass} data-route="unify" onclick={handleRouteSelect}>
                                        <template lwc:if={isUnifySelected}>
                                            <div class="visual-picker-checkmark">
                                                <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                            </div>
                                        </template>
                                        <div class="slds-p-around_medium">
                                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                Unify Unmatched Records
                                                <lightning-badge label="Recommended" class="slds-m-left_x-small"></lightning-badge>
                                            </h3>
                                            <p class="slds-text-body_small slds-text-color_weak">Create new match rules to consolidate duplicate records</p>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                                <lightning-layout-item size="4" padding="around-small">
                                    <div class={getMdmCardClass} data-route="mdm" onclick={handleRouteSelect}>
                                        <template lwc:if={isMdmSelected}>
                                            <div class="visual-picker-checkmark">
                                                <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                            </div>
                                        </template>
                                        <div class="slds-p-around_medium">
                                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Import from your MDM plan</h3>
                                            <p class="slds-text-body_small slds-text-color_weak">Import pre-existing rulesets from Master Data Management systems</p>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                                <lightning-layout-item size="4" padding="around-small">
                                    <div class={getDatakitCardClass} data-route="datakit" onclick={handleRouteSelect}>
                                        <template lwc:if={isDatakitSelected}>
                                            <div class="visual-picker-checkmark">
                                                <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                            </div>
                                        </template>
                                        <div class="slds-p-around_medium">
                                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Import from Data Kits</h3>
                                            <p class="slds-text-body_small slds-text-color_weak">Use pre-configured ruleset templates from Salesforce Data Kits</p>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                            </lightning-layout>

                            <div class="slds-text-align_center slds-m-top_large">
                                <lightning-button
                                    label="New"
                                    variant="brand"
                                    onclick={handleNewRuleset}>
                                </lightning-button>
                            </div>
                        </div>
                    </lightning-card>
                    </template>

                    <!-- Ruleset List (only after a ruleset has been created) -->
                    <template lwc:if={showRulesetList}>
                    <div class="slds-m-top_medium slds-m-bottom_small"></div>
                    <lightning-card>
                        <div class="slds-p-around_medium">
                            <div class="slds-m-bottom_large">
                                <h2 class="slds-text-heading_medium">Ruleset List</h2>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">List of rulesets created and analytics of it for users to see</p>
                            </div>

                            <template for:each={rulesetList} for:item="ruleset">
                                <div key={ruleset.id} class="ruleset-card slds-m-bottom_large">
                                    <!-- Card Header -->
                                    <div class="ruleset-card-header">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <lightning-icon icon-name="standard:groups" size="small" class="slds-m-right_small"></lightning-icon>
                                            <div>
                                                <h3 class="slds-text-heading_small">{ruleset.name}</h3>
                                                <span class="slds-text-body_small slds-text-color_weak">{ruleset.entityType} · Last run: {ruleset.lastRun}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Stat Strip -->
                                    <div class="ruleset-stat-strip">
                                        <div class="ruleset-stat">
                                            <div class="ruleset-stat-value ruleset-stat-value_brand">{ruleset.profilesMerged}</div>

                            </div>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 35%"><div class="slds-truncate">DMO</div></th>
                                        <th scope="col" style="width: 65%"><div class="slds-truncate">Trusted Data Source</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td><div class="slds-truncate">Individual</div></td>
                                        <td><div class="slds-truncate">{individualDloLabel}</div></td>
                                    </tr>
                                    <tr>
                                        <td><div class="slds-truncate">Contact Point Address</div></td>
                                        <td><div class="slds-truncate">{contactPointAddressLabel}</div></td>
                                    </tr>
                                    <tr>
                                        <td><div class="slds-truncate">Contact Point App</div></td>
                                        <td><div class="slds-truncate">{contactPointAppLabel}</div></td>
                                    </tr>
                                    <tr>
                                        <td><div class="slds-truncate">Contact Point Email</div></td>
                                        <td><div class="slds-truncate">{contactPointEmailLabel}</div></td>
                                    </tr>
                                    <tr>
                                        <td><div class="slds-truncate">Contact Point Social</div></td>
                                        <td><div class="slds-truncate">{contactPointSocialLabel}</div></td>
                                    </tr>
                                    <tr>
                                        <td><div class="slds-truncate">Contact Point Phone</div></td>
                                        <td><div class="slds-truncate">{contactPointPhoneLabel}</div></td>
                                    </tr>
                                    <tr>
                                        <td><div class="slds-truncate">Party ID</div></td>
                                        <td><div class="slds-truncate">{partyIdLabel}</div></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        </lightning-tab>
                        <lightning-tab label="Processing History" value="history">
                        <div class="oc-section">
                            <!-- Header row -->
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                <div>
                                    <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">Ruleset History</h2>
                                    <p class="slds-text-body_small slds-text-color_weak">This log includes all changes to your ruleset and ruleset runs. Incremental runs are grouped if multiple runs happen within the same period.</p>
                                </div>
                                <div class="slds-col_bump-left slds-grid slds-grid_vertical-align-center">
                                    <lightning-button label="Download" variant="neutral" icon-name="utility:download" icon-position="left" class="slds-m-right_small"></lightning-button>
                                    <lightning-input type="search" label="Search" variant="label-hidden" placeholder="Search..." class="slds-m-right_x-small"></lightning-input>
                                    <lightning-button-icon icon-name="utility:filterList" variant="border-filled" alternative-text="Filter"></lightning-button-icon>
                                </div>
                            </div>

                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout ruleset-history-table">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 3rem;"></th>
                                        <th scope="col">
                                            <div class="slds-truncate">Date &amp; Time Duration
                                                <lightning-helptext content="Date and time of the job run, and its duration." icon-name="utility:info"></lightning-helptext>
                                            </div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate">Run Reason
                                                <lightning-helptext content="What triggered this run." icon-name="utility:info"></lightning-helptext>
                                            </div>
                                        </th>
                                        <th scope="col"><div class="slds-truncate">Total Source Profiles</div></th>
                                        <th scope="col"><div class="slds-truncate">Total Unified Profiles</div></th>
                                        <th scope="col"><div class="slds-truncate">Total Known Records</div></th>
                                        <th scope="col"><div class="slds-truncate">Filtered Records</div></th>
                                        <th scope="col"><div class="slds-truncate">Processed Records</div></th>
                                        <th scope="col"><div class="slds-truncate">Consolidatio...</div></th>
                                        <th scope="col"><div class="slds-truncate">Status</div></th>
                                        <th scope="col"><div class="slds-truncate">Job ID</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={rulesetHistoryList} for:item="row">
                                        <tr key={row.id} class="slds-hint-parent">
                                            <td>
                                                <lightning-button-icon icon-name="utility:chevronright" variant="bare" size="small" alternative-text="Expand"></lightning-button-icon>
                                            </td>
                                            <td>
                                                <div class="slds-truncate">{row.dateTime}</div>
                                                <div class="slds-text-body_small slds-text-color_weak">{row.duration}</div>
                                            </td>
                                            <td><div class="slds-truncate">{row.runReason}</div></td>
                                            <td><div class="slds-truncate">{row.totalSourceProfiles}</div></td>
                                            <td><div class="slds-truncate">{row.totalUnifiedProfiles}</div></td>
                                            <td><div class="slds-truncate">{row.totalKnownRecords}</div></td>
                                            <td><div class="slds-truncate">{row.filteredRecords}</div></td>
                                            <td><div class="slds-truncate">{row.processedRecords}</div></td>
                                            <td><div class="slds-truncate">{row.consolidationRate}</div></td>
                                            <td>
                                                <template lwc:if={row.isSucceeded}>
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <lightning-icon icon-name="utility:success" size="x-small" variant="success" class="slds-m-right_xx-small"></lightning-icon>
                                                        <span class="slds-text-color_success">Succeeded</span>
                                                    </div>
                                                </template>
                                                <template lwc:elseif={row.isWarning}>
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_xx-small status-warning"></lightning-icon>
                                                        <span class="status-warning">{row.statusLabel}</span>
                                                    </div>
                                                </template>
                                                <template lwc:elseif={row.isError}>
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                                                        <span class="slds-text-color_error">{row.statusLabel}</span>
                                                    </div>
                                                </template>
                                            </td>
                                            <td><div class="slds-truncate slds-text-color_weak">{row.jobId}</div></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        </lightning-tab>
                    </lightning-tabset>
                </div>
            </div>
        </template>

    </div>

    <!-- Docked Footer (wizard navigation) -->
    <template lwc:if={showStep3DockedFooter}>
        <div class="edit-docked-footer edit-docked-footer_wizard">
            <lightning-button
                label="Cancel"
                variant="neutral"
                onclick={handleCancelStep}>
            </lightning-button>
            <span class="wizard-panel__footer-progress">{dockedFooterStepText}</span>
            <div class="edit-docked-footer__right">
                <lightning-button
                    label="Next"
                    variant="neutral"
                    onclick={handleDockedNext}>
                </lightning-button>
                <lightning-button
                    label="Create Ruleset"
                    variant="brand"
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </div>
    </template>

    <!-- Docked Footer (Edit Mode) -->
    <template lwc:if={isEditMode}>
        <div class="edit-docked-footer">
            <div class="edit-docked-footer__actions">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    class="slds-m-right_small"
                    onclick={handleEditCancel}>
                </lightning-button>
                <lightning-button
                    label="Save"
                    variant="brand"
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </div>
    </template>

    <!-- Floating design version toggle — only on setup Step 1 -->
    <template lwc:if={showVersionToggle}>
        <div class="scenario-fab">
            <span class="scenario-fab__label">Design</span>
            <div class="scenario-fab__pills">
                <button class={scenario1BtnClass} onclick={handleScenario1}>V1</button>
                <button class={scenario2BtnClass} onclick={handleScenario2}>V2</button>
            </div>
        </div>
    </template>

</template>
