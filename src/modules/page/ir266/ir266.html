<template>
    <div class="slds-grid slds-wrap">
        <!-- Side Navigation -->
        <div class="slds-col side-nav-container" lwc:if={showSideNav}>
            <div class="side-nav-content">
                <lightning-input
                    type="search"
                    label="Quick Find"
                    variant="label-hidden"
                    placeholder="Quick Find"
                    class="slds-p-around_medium">
                </lightning-input>

                <nav class="slds-nav-vertical slds-nav-vertical_shade" aria-label="Sub page">
                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:filter" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Connect & Unify</span>
                            <lightning-button-icon
                                icon-name="utility:chevrondown"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                        <ul>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Streams</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Lake Objects</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Transforms</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Model</a>
                            </li>
                            <li class="slds-nav-vertical__item slds-is-active">
                                <a href="#" class="slds-nav-vertical__action" aria-current="page">Identity Resolutions</a>
                            </li>
                        </ul>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:shield" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Govern & Secure</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:transform" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Process & Enrich</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:metrics" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Explore & Optimize</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:graph" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Analyze & Predict</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:clock" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Segment & Act</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>
                </nav>
            </div>

            <div class="side-nav-footer">
                <lightning-button
                    label="Collapse"
                    icon-name="utility:back"
                    icon-position="left"
                    variant="base"
                    class="slds-button_stretch"
                    onclick={handleCollapseSideNav}>
                </lightning-button>
            </div>
        </div>

        <!-- Expand Button (when collapsed) -->
        <template lwc:if={showExpandButton}>
            <div class="slds-col slds-size_1-of-12 slds-p-right_small">
                <lightning-button
                    icon-name="utility:forward"
                    variant="neutral"
                    title="Expand Navigation"
                    onclick={handleExpandSideNav}>
                </lightning-button>
            </div>
        </template>

        <!-- Step Navigation -->
        <div class="slds-col slds-p-horizontal_small step-nav-column">
            <div class="step-nav-header">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                    <h2 class="slds-text-heading_small">Identity Resolution</h2>
                    <lightning-button-icon
                        icon-name="standard:bot"
                        variant="border-filled"
                        alternative-text="Open Agent Chat"
                        title="Chat with D360 Agent"
                        onclick={handleOpenChat}>
                    </lightning-button-icon>
                </div>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Sequential guided experience</p>
            </div>

            <!-- DAY 0 - INITIAL CONFIGURATION -->
            <h3 class="step-section-header">DAY 0 - INITIAL CONFIGURATION</h3>

            <!-- Step: Pre-Configuration -->
            <article class={preConfigCardClass} data-step="0" onclick={handleStepClick}>
                <div class="step-card-content">
                    <div class="step-badge-circle">
                        <lightning-icon icon-name="utility:settings" size="x-small"></lightning-icon>
                    </div>
                    <div class="step-card-body">
                        <h4 class="step-card-title">Check data quality & mappings</h4>
                        <p class="step-card-description">Profile the DMO layer, fix mappings + DQ, build confidence in the data feeding IR.</p>
                    </div>
                </div>
            </article>

            <!-- Configuration Steps -->
            <template lwc:if={alwaysShowSteps}>
                <!-- Step 1: Select Unification Type -->
                <article class={step1CardClass} data-step="1" onclick={handleStepClick}>
                    <div class="step-card-content">
                        <div class="step-badge-circle">1</div>
                        <div class="step-card-body">
                            <h4 class="step-card-title">Step 1 — Select Unification Type</h4>
                            <p class="step-card-description">Choose what records this ruleset will consolidate.</p>
                        </div>
                    </div>
                </article>

                <!-- Step 2: Trusted Sources -->
                <article class={step2CardClass} data-step="2" onclick={handleStepClick}>
                    <div class="step-card-content">
                        <div class="step-badge-circle">2</div>
                        <div class="step-card-body">
                            <h4 class="step-card-title">{step2Title}</h4>
                            <p class="step-card-description">Fine-tune match rules, add trusted data sources, and customize advanced settings.</p>
                        </div>
                    </div>
                </article>

                <!-- Step 3: Generate Match Rules (Unify only) -->
                <template lwc:if={showStep4}>
                    <article class={step3CardClass} data-step="3" onclick={handleStepClick}>
                        <div class="step-card-content">
                            <div class="step-badge-circle">3</div>
                            <div class="step-card-body">
                                <h4 class="step-card-title">Step 3 — Generate Match Rules</h4>
                                <p class="step-card-description">Choose AI-generated rules or create custom matching criteria.</p>
                            </div>
                        </div>
                    </article>
                </template>
            </template>

            <!-- AFTER DAY 0 - OPERATE -->
            <h3 class="step-section-header slds-m-top_large">AFTER DAY 0 - OPERATE</h3>

            <article class="step-card step-card-inactive">
                <div class="step-card-content">
                    <div class="step-badge-circle">1</div>
                    <div class="step-card-body">
                        <h4 class="step-card-title">Step 1 (After Day 0) — Operate & Certify</h4>
                        <p class="step-card-description">Separate flow — review the projected impact across the full space, then certify the ruleset.</p>
                    </div>
                </div>
            </article>
        </div>

        <!-- Main Content Area -->
        <div class="slds-col slds-p-horizontal_small main-content-area">
            <lightning-card>
                <h1 slot="title" class="slds-text-heading_medium">{currentStepTitle}</h1>
                <p slot="subtitle">{currentStepSubtitle}</p>

                <div class="slds-p-around_medium">
                    <!-- Pre-Configuration: DMO, Mappings, Data Quality -->
                    <template lwc:if={isPreConfig}>
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Data Model Objects (DMO)</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Configure your data model objects before creating rulesets</p>
                                <div class="slds-box slds-box_x-small slds-theme_success">
                                    <lightning-icon icon-name="utility:success" size="small" variant="success" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="slds-text-body_regular">5 DMOs configured and ready</span>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Field Mappings</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Ensure all required fields are properly mapped</p>
                                <div class="slds-box slds-box_x-small slds-theme_success">
                                    <lightning-icon icon-name="utility:success" size="small" variant="success" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="slds-text-body_regular">94% mapping coverage across all sources</span>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Data Quality Validation</h3>
                                <lightning-layout>
                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class="slds-box slds-box_x-small slds-text-align_center">
                                            <div class="slds-text-heading_small">1.2M</div>
                                            <div class="slds-text-body_small">Records Scanned</div>
                                        </div>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class="slds-box slds-box_x-small slds-text-align_center">
                                            <div class="slds-text-heading_small">98%</div>
                                            <div class="slds-text-body_small">PartyId Complete</div>
                                        </div>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class="slds-box slds-box_x-small slds-text-align_center">
                                            <div class="slds-text-heading_small">5</div>
                                            <div class="slds-text-body_small">Data Sources</div>
                                        </div>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" class="slds-m-top_large">
                                <div class="slds-box slds-box_x-small slds-theme_success slds-text-align_center">
                                    <div class="slds-media slds-media_center">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="utility:success" size="small" variant="success"></lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <h3 class="slds-text-heading_small">Data Quality — Good</h3>
                                            <p class="slds-text-body_small">You can proceed with Identity Resolution</p>
                                        </div>
                                    </div>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" class="slds-m-top_large">
                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">How do you want to create your identity resolution ruleset?</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Choose the approach that fits your needs</p>

                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class={getRouteCardClass} data-route="unify" onclick={handleRouteSelect}>
                                            <template lwc:if={isUnifySelected}>
                                                <div class="visual-picker-checkmark">
                                                    <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                                </div>
                                            </template>
                                            <div class="slds-p-around_medium">
                                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                    Unify Unmatched Records
                                                    <lightning-badge label="Recommended" class="slds-m-left_x-small"></lightning-badge>
                                                </h3>
                                                <p class="slds-text-body_small slds-text-color_weak">Create new match rules to consolidate duplicate records</p>
                                            </div>
                                        </div>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class={getMdmCardClass} data-route="mdm" onclick={handleRouteSelect}>
                                            <template lwc:if={isMdmSelected}>
                                                <div class="visual-picker-checkmark">
                                                    <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                                </div>
                                            </template>
                                            <div class="slds-p-around_medium">
                                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">Import MDM</h3>
                                                <p class="slds-text-body_small slds-text-color_weak">Import pre-existing rulesets from Master Data Management systems</p>
                                            </div>
                                        </div>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="4" padding="around-small">
                                        <div class={getDatakitCardClass} data-route="datakit" onclick={handleRouteSelect}>
                                            <template lwc:if={isDatakitSelected}>
                                                <div class="visual-picker-checkmark">
                                                    <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                                </div>
                                            </template>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Import from Data Kits</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Use pre-configured ruleset templates from Salesforce Data Kits</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                                </lightning-layout>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>

                    <!-- Step 1: Select Unification Type & Basic Details (Combined) -->
                    <template lwc:elseif={isStep1}>
                        <div class="slds-text-longform slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">What records will this ruleset consolidate?</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Choose the entity type you want to create unified records for</p>
                        </div>

                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class="visual-picker-card visual-picker-selected">
                                    <div class="visual-picker-checkmark">
                                        <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                    </div>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                            Individual
                                            <lightning-badge label="Recommended" class="slds-m-left_x-small"></lightning-badge>
                                        </h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Create unified person profiles across your data sources</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class="visual-picker-card">
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Account</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Create unified business/company profiles</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small">
                                <div class="visual-picker-card">
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Household</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Group individuals into household units</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>

                        <!-- Basic Details in Same Step -->
                        <lightning-card title="Ruleset Configuration" class="slds-m-top_large">
                            <div class="slds-p-around_medium">
                                <lightning-input
                                    label="Ruleset Name"
                                    placeholder="e.g., Individual IR - Production"
                                    required
                                    class="slds-m-bottom_medium">
                                </lightning-input>

                                <lightning-input
                                    label="Ruleset ID"
                                    placeholder="Auto-generated or custom ID"
                                    class="slds-m-bottom_medium">
                                </lightning-input>

                                <lightning-combobox
                                    label="Match Primary DMO Records"
                                    placeholder="Select a primary DMO object"
                                    options={dmoOptions}
                                    required
                                    class="slds-m-bottom_medium">
                                </lightning-combobox>

                                <lightning-textarea
                                    label="Description"
                                    placeholder="Describe the purpose and scope of this ruleset..."
                                    field-level-help="Add details about what this ruleset will accomplish"
                                    class="slds-m-bottom_medium">
                                </lightning-textarea>
                            </div>
                        </lightning-card>
                    </template>

                    <!-- Step 2: Trusted Sources -->
                    <template lwc:elseif={isStep2}>
                        <lightning-card title="Ruleset Configuration">
                            <div class="slds-p-around_medium">
                                <lightning-input
                                    label="Ruleset Name"
                                    placeholder="e.g., Individual IR - Production"
                                    required
                                    class="slds-m-bottom_medium">
                                </lightning-input>

                                <lightning-input
                                    label="Ruleset ID"
                                    placeholder="Auto-generated or custom ID"
                                    class="slds-m-bottom_medium">
                                </lightning-input>

                                <lightning-combobox
                                    label="Match Primary DMO Records"
                                    placeholder="Select a primary DMO object"
                                    options={dmoOptions}
                                    required
                                    class="slds-m-bottom_medium">
                                </lightning-combobox>

                                <lightning-textarea
                                    label="Description"
                                    placeholder="Describe the purpose and scope of this ruleset..."
                                    field-level-help="Add details about what this ruleset will accomplish"
                                    class="slds-m-bottom_medium">
                                </lightning-textarea>
                            </div>
                        </lightning-card>
                    </template>

                    <!-- Step 2: Trusted Sources (Optional for Unify, Required for MDM) -->
                    <template lwc:elseif={isStep2}>
                        <lightning-card title="Trusted Data Sources">
                            <div class="slds-p-around_medium">
                                <template lwc:if={step2Required}>
                                    <div class="slds-notify slds-notify_toast slds-theme_warning slds-m-bottom_medium" role="status">
                                        <div class="slds-notify__content">
                                            <p><strong>Required for MDM import</strong> — You must select a Data Lake Object for 7 DMOs as trusted sources.</p>
                                        </div>
                                    </div>
                                </template>

                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                                    Designate specific sources as authoritative for certain attributes. When conflicts arise, trusted sources always win.
                                </p>

                                <lightning-combobox
                                    label="Select Data Lake Object for Trusted Sources"
                                    placeholder="Choose a Data Lake Object"
                                    options={dloOptions}
                                    class="slds-m-bottom_medium">
                                </lightning-combobox>

                                <div class="slds-box slds-box_x-small slds-theme_shade slds-text-align_center slds-p-around_medium">
                                    <p class="slds-text-body_small slds-text-color_weak">Additional trusted source configuration will appear after selection</p>
                                </div>
                            </div>
                        </lightning-card>
                    </template>

                    <!-- Step 3: Generate Match Rules (Only for Unify route) -->
                    <template lwc:elseif={isStep3}>
                        <lightning-card title="Match Rule Configuration">
                            <div class="slds-p-around_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Choose Your Approach</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                                    Generate AI-powered match rules based on your data, or create custom rules manually
                                </p>

                                <lightning-radio-group
                                    label="Match Rule Strategy"
                                    options={strategyOptions}
                                    value="typical"
                                    type="button"
                                    class="slds-m-bottom_medium">
                                </lightning-radio-group>

                                <div class="slds-box slds-box_x-small slds-m-bottom_medium">
                                    <p class="slds-text-body_small"><strong>Typical Match Rules:</strong> Balanced precision and recall. Recommended for most use cases with moderate tolerance for false positives.</p>
                                </div>

                                <div class="slds-m-top_large">
                                    <lightning-button
                                        label="Create Custom Match Rules"
                                        variant="neutral"
                                        icon-name="utility:add"
                                        class="slds-m-right_small">
                                    </lightning-button>
                                    <span class="slds-text-body_small slds-text-color_weak">Advanced: Define your own matching criteria</span>
                                </div>

                                <!-- Preview Results -->
                                <div class="slds-m-top_large">
                                    <h3 class="slds-text-heading_small slds-m-bottom_small">Preview Results</h3>
                                    <div class="slds-notify slds-notify_toast slds-theme_info slds-m-bottom_medium" role="status">
                                        <div class="slds-notify__content">
                                            <p>Preview reflects your selected strategy — these numbers show projected unification results</p>
                                        </div>
                                    </div>

                                    <lightning-layout>
                                        <lightning-layout-item size="4" padding="around-small">
                                            <div class="slds-box slds-box_x-small slds-text-align_center">
                                                <div class="slds-text-heading_large">1.2M</div>
                                                <div class="slds-text-body_small slds-text-color_weak">Source rows</div>
                                            </div>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="4" padding="around-small">
                                            <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                                                <div class="slds-text-heading_large slds-text-color_brand">847K</div>
                                                <div class="slds-text-body_small slds-text-color_weak">Unified profiles</div>
                                            </div>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="4" padding="around-small">
                                            <div class="slds-box slds-box_x-small slds-text-align_center slds-theme_shade">
                                                <div class="slds-text-heading_large slds-text-color_brand">29%</div>
                                                <div class="slds-text-body_small slds-text-color_weak">Consolidation</div>
                                            </div>
                                        </lightning-layout-item>
                                    </lightning-layout>
                                </div>
                            </div>
                        </lightning-card>
                    </template>
                </div>

                <!-- Footer -->
                <div slot="footer" class="footer-container">
                    <lightning-button
                        label="Back"
                        variant="neutral"
                        onclick={handleBack}
                        disabled={isFirstStep}>
                    </lightning-button>

                    <!-- Credit Consumption Indicator (center) -->
                    <div class="footer-center">
                        <span class="slds-text-body_small slds-text-color_weak">Estimated credits: </span>
                        <strong class="slds-text-body_small slds-text-color_brand">{estimatedCredits}</strong>
                        <lightning-button-icon
                            icon-name="utility:info"
                            variant="bare"
                            alternative-text="View credit breakdown"
                            title="View credit breakdown"
                            class="slds-m-left_xx-small"
                            onclick={handleShowCreditBreakdown}>
                        </lightning-button-icon>
                    </div>

                    <div class="footer-right">
                        <template lwc:if={showNextButton}>
                            <lightning-button
                                label={nextButtonLabel}
                                variant="brand"
                                onclick={handleNext}>
                            </lightning-button>
                        </template>
                    </div>
                </div>
            </lightning-card>
        </div>

        <!-- Chat Panel (Docked Composer) -->
        <div class="slds-col slds-size_3-of-12 slds-p-left_small" lwc:if={showChatPanel}>
            <div class="slds-docked-composer slds-grid slds-grid_vertical slds-is-open" style="height: calc(100vh - 8rem);">
                <div class="slds-docked-composer__header slds-grid slds-grid_align-spread slds-shrink-none">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure slds-m-right_x-small">
                            <lightning-icon icon-name="standard:bot" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-truncate" title="D360 Agent SG">D360 Agent SG</h2>
                        </div>
                    </div>
                    <div class="slds-col_bump-left slds-shrink-none">
                        <lightning-button-icon
                            icon-name="utility:close"
                            variant="bare"
                            alternative-text="Close"
                            title="Close"
                            onclick={handleCloseChat}>
                        </lightning-button-icon>
                    </div>
                </div>
                <div class="slds-docked-composer__body slds-col slds-grid slds-grid_vertical slds-nowrap" style="overflow-y: auto;">
                    <div class="slds-p-around_medium">
                        <div class="slds-chat">
                            <ul class="slds-chat-list">
                                <li class="slds-chat-listitem slds-chat-listitem_inbound">
                                    <div class="slds-chat-message">
                                        <div class="slds-chat-message__body">
                                            <div class="slds-chat-message__text slds-chat-message__text_inbound">
                                                <span>Hello! I'm here to help you with Identity Resolution. Complete the pre-configuration checks to get started.</span>
                                            </div>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="slds-docked-composer__footer slds-shrink-none">
                    <div class="slds-p-around_small">
                        <lightning-textarea
                            placeholder="Ask about Identity Resolution..."
                            class="slds-m-bottom_x-small">
                        </lightning-textarea>
                        <lightning-button label="Send" variant="brand" class="slds-float_right"></lightning-button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</template>
