<template>
    <!-- Success Notification (Top of Page) -->
    <template lwc:if={showSuccessNotification}>
        <div class="slds-notify_container slds-is-relative" style="position: fixed; top: 0; left: 0; right: 0; z-index: 10000;">
            <div class="slds-notify slds-notify_toast slds-theme_success" role="status">
                <span class="slds-assistive-text">Success</span>
                <span class="slds-icon_container slds-icon-utility-success slds-m-right_small slds-no-flex slds-align-top">
                    <lightning-icon icon-name="utility:success" size="small" variant="inverse" alternative-text="Success"></lightning-icon>
                </span>
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small">{successMessage}</h2>
                </div>
                <div class="slds-notify__close">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        alternative-text="Close"
                        title="Close"
                        onclick={handleCloseNotification}>
                    </lightning-button-icon>
                </div>
            </div>
        </div>
    </template>

    <div class="slds-grid slds-wrap full-height-grid">
        <!-- Side Navigation -->
        <div class={sideNavClass} lwc:if={showSideNav}>
            <!-- Search area -->
            <div class="side-nav__search">
                <template lwc:if={sideNavExpanded}>
                    <lightning-input
                        type="search"
                        label="Quick Find"
                        variant="label-hidden"
                        placeholder="Quick Find"
                        class="slds-p-around_x-small">
                    </lightning-input>
                </template>
                <template lwc:else>
                    <div class="side-nav__search-icon-btn" onclick={handleToggleSideNav} title="Expand navigation">
                        <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                    </div>
                </template>
            </div>

            <!-- Nav sections -->
            <div class="side-nav-content">
                <nav class="slds-nav-vertical slds-nav-vertical_shade" aria-label="Sub page">
                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title" onclick={handleToggleSideNav}>
                            <lightning-icon icon-name="utility:filter" size="x-small" class="side-nav__section-icon"></lightning-icon>
                            <span class="side-nav__section-label">Connect &amp; Unify</span>
                            <lightning-button-icon
                                icon-name="utility:chevrondown"
                                variant="bare"
                                class="side-nav__section-chevron"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                        <ul class="side-nav__section-children">
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Streams</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Lake Objects</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Transforms</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Model</a>
                            </li>
                            <li class="slds-nav-vertical__item slds-is-active">
                                <a href="#" class="slds-nav-vertical__action" aria-current="page" onclick={handleGoToLandingPage}>Identity Resolution</a>
                            </li>
                        </ul>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title" onclick={handleToggleSideNav}>
                            <lightning-icon icon-name="utility:shield" size="x-small" class="side-nav__section-icon"></lightning-icon>
                            <span class="side-nav__section-label">Govern &amp; Secure</span>
                            <lightning-button-icon icon-name="utility:chevronright" variant="bare" class="side-nav__section-chevron" alternative-text="Expand section"></lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title" onclick={handleToggleSideNav}>
                            <lightning-icon icon-name="utility:transform" size="x-small" class="side-nav__section-icon"></lightning-icon>
                            <span class="side-nav__section-label">Process &amp; Enrich</span>
                            <lightning-button-icon icon-name="utility:chevronright" variant="bare" class="side-nav__section-chevron" alternative-text="Expand section"></lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title" onclick={handleToggleSideNav}>
                            <lightning-icon icon-name="utility:metrics" size="x-small" class="side-nav__section-icon"></lightning-icon>
                            <span class="side-nav__section-label">Explore &amp; Optimize</span>
                            <lightning-button-icon icon-name="utility:chevronright" variant="bare" class="side-nav__section-chevron" alternative-text="Expand section"></lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title" onclick={handleToggleSideNav}>
                            <lightning-icon icon-name="utility:graph" size="x-small" class="side-nav__section-icon"></lightning-icon>
                            <span class="side-nav__section-label">Analyze &amp; Predict</span>
                            <lightning-button-icon icon-name="utility:chevronright" variant="bare" class="side-nav__section-chevron" alternative-text="Expand section"></lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title" onclick={handleToggleSideNav}>
                            <lightning-icon icon-name="utility:clock" size="x-small" class="side-nav__section-icon"></lightning-icon>
                            <span class="side-nav__section-label">Segment &amp; Act</span>
                            <lightning-button-icon icon-name="utility:chevronright" variant="bare" class="side-nav__section-chevron" alternative-text="Expand section"></lightning-button-icon>
                        </h2>
                    </div>
                </nav>
            </div>

            <!-- Collapse/expand toggle footer -->
            <div class="side-nav-footer" onclick={handleToggleSideNav}>
                <lightning-icon icon-name={sideNavToggleIcon} size="x-small" class="side-nav__toggle-icon"></lightning-icon>
                <span class="side-nav__section-label side-nav__collapse-label">Collapse</span>
            </div>
        </div>

        <!-- Landing Page Content -->
        <template lwc:if={showLandingPage}>
            <div class="slds-col landing-page-wrapper">
                <div class="landing-page-container">
                    <!-- EOU Guidance Header -->
                    <div class="guidance-header slds-m-bottom_medium">
                        <template lwc:if={guidanceExpanded}>
                            <div class="guidance-header-expanded">
                                <div class="guidance-header-title-row" onclick={handleGuidanceToggle}>
                                    <lightning-icon icon-name="utility:chevrondown" size="x-small" class="chevron-icon"></lightning-icon>
                                    <h2 class="guidance-header-title-expanded">Identity Resolution</h2>
                                </div>
                                <div class="guidance-header-content guidance-header-content--no-card">
                                    <p class="guidance-header-description guidance-header-description--no-card">Configure how customer profiles from different sources are matched and unified into a single identity. Set up match rules, reconciliation logic, and trusted data sources.</p>
                                    <div class="guidance-header-links guidance-header-links--column">
                                        <a href="#" class="guidance-header-link">Identity Resolution Overview <lightning-icon icon-name="utility:new_window" size="xx-small" class="external-icon"></lightning-icon></a>
                                        <a href="#" class="guidance-header-link">Match Rule Best Practices <lightning-icon icon-name="utility:new_window" size="xx-small" class="external-icon"></lightning-icon></a>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="guidance-header-collapsed" onclick={handleGuidanceToggle}>
                                <lightning-icon icon-name="utility:chevronright" size="x-small" class="chevron-icon"></lightning-icon>
                                <h2 class="guidance-header-title-collapsed">Identity Resolution</h2>
                            </div>
                        </template>
                    </div>

                    <!-- Page Header -->
                    <div class="slds-page-header slds-m-bottom_large">
                        <div class="slds-page-header__row">
                            <div class="slds-page-header__col-title">
                                <div class="slds-media">
                                    <div class="slds-media__figure slds-m-right_small">
                                        <lightning-icon icon-name="standard:individual" size="medium"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <p class="header-label">SETUP</p>
                                        <h1 class="custom-header" title="Identity Resolution">Identity Resolution</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Route Selection (hidden once a ruleset has been created) -->
                    <template lwc:if={showCreateRuleset}>
                    <div class="slds-m-top_medium slds-m-bottom_small"></div>
                    <lightning-card>
                        <div class="slds-p-around_medium">
                            <h2 class="slds-text-heading_medium slds-text-align_center slds-m-bottom_small">Discover who your customers are</h2>
                            <p class="slds-text-body_small slds-text-align_center slds-m-bottom_large">Clean and merge your customer data accurately with rulesets - through D360 configurations your own existing setup</p>

                            <!-- Empty state illustration -->
                            <div class="plan-empty-state">
                                <div class="slds-illustration slds-illustration_small">
                                    <img src="/images/empty-state-tasks.svg" class="slds-illustration__svg" alt="" />
                                    <div class="slds-text-longform">
                                        <p class="slds-text-body_regular slds-text-color_weak">How would you like to create your first ruleset?</p>
                                    </div>
                                </div>

                                <!-- New button — goes directly to Determine Type step -->
                                <lightning-button
                                    label="New"
                                    variant="brand"
                                    onclick={handleNewRuleset}>
                                </lightning-button>
                            </div>
                        </div>
                    </lightning-card>
                    </template>

                    <!-- Ruleset List (only after a ruleset has been created) -->
                    <template lwc:if={showRulesetList}>
                    <!-- Toolbar row -->
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-top_medium slds-m-bottom_x-small">
                        <span class="slds-text-body_small slds-text-color_weak">2 items · Updated a few seconds ago</span>
                        <div class="slds-col_bump-left slds-grid slds-gutters_x-small slds-grid_vertical-align-center">
                            <lightning-button label="New" variant="brand" onclick={handleBeginClick}></lightning-button>
                            <lightning-input type="search" label="" placeholder="Search this list..." variant="label-hidden"></lightning-input>
                            <lightning-button-icon icon-name="utility:settings" variant="border-filled" alternative-text="Settings"></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:table" variant="border-filled" alternative-text="Table"></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:refresh" variant="border-filled" alternative-text="Refresh"></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:switch" variant="border-filled" alternative-text="Switch"></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:edit" variant="border-filled" alternative-text="Edit"></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:filterList" variant="border-filled" alternative-text="Filter"></lightning-button-icon>
                        </div>
                    </div>
                    <!-- Data table -->
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout ruleset-list-table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" style="width:2.5rem;"></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Ruleset Name</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Ruleset ID</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Data Space</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Primary Data Mo...</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Ruleset Status</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Last Job Status</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Source Profiles</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Matched Sour...</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Total Unified P...</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col"><div class="slds-grid slds-grid_vertical-align-center"><span class="slds-truncate">Consolidation ...</span><lightning-icon icon-name="utility:arrowdown" size="x-small" class="slds-m-left_xx-small"></lightning-icon></div></th>
                                <th scope="col" style="width:2.5rem;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="slds-text-color_weak">1</td>
                                <td><a href="#" class="slds-truncate" onclick={handleRulesetClick}>Real-Time Individual Matching</a></td>
                                <td><div class="slds-truncate">ccid</div></td>
                                <td><a href="#" class="slds-truncate">default</a></td>
                                <td><div class="slds-truncate">Individual</div></td>
                                <td><div class="slds-truncate">Published</div></td>
                                <td><div class="slds-truncate">Succeeded</div></td>
                                <td><div class="slds-truncate">204</div></td>
                                <td><div class="slds-truncate">3</div></td>
                                <td><div class="slds-truncate">202</div></td>
                                <td><div class="slds-truncate">1%</div></td>
                                <td><lightning-button-icon icon-name="utility:chevrondown" variant="border-filled" size="x-small" alternative-text="More"></lightning-button-icon></td>
                            </tr>
                            <tr>
                                <td class="slds-text-color_weak">2</td>
                                <td><a href="#" class="slds-truncate">test_1</a></td>
                                <td><div class="slds-truncate">1234</div></td>
                                <td><a href="#" class="slds-truncate">default</a></td>
                                <td><div class="slds-truncate">Individual</div></td>
                                <td><div class="slds-truncate">Published</div></td>
                                <td></td><td></td><td></td><td></td><td></td>
                                <td><lightning-button-icon icon-name="utility:chevrondown" variant="border-filled" size="x-small" alternative-text="More"></lightning-button-icon></td>
                            </tr>
                        </tbody>
                    </table>
                    </template>
                </div>
            </div>
        </template>


        <!-- Determine Type of Ruleset task panel -->
        <template lwc:if={isDetermineTask}>
            <div class="wizard-canvas-layout">
                <div class="canvas-page__header">
                    <div class="canvas-page__header-inner">
                        <div class="canvas-page__heading">
                            <p class="canvas-page__eyebrow">Identity Resolution</p>
                            <h1 class="canvas-page__title">Create New Ruleset</h1>
                        </div>
                        <div class="canvas-page__header-actions">
                            <lightning-button label="Help" icon-name="utility:question" variant="neutral" onclick={handleOpenChat}></lightning-button>
                            <lightning-button-icon icon-name="utility:expand_alt" variant="neutral" alternative-text="Full screen" title="Full screen" onclick={handleExpandToggle}></lightning-button-icon>
                        </div>
                    </div>
                </div>
                <div class="wizard-canvas-body">
                    <div class="wizard-progress-nav">
                        <ol class="wizard-progress-list">
                            <li class={progressStep0Class}>
                                <div class="wizard-progress-marker"></div>
                                <span class="wizard-progress-label">Ruleset build type selection</span>
                            </li>
                            <li class={progressStep1Class}>
                                <div class="wizard-progress-marker"></div>
                                <span class="wizard-progress-label">Profile unification type selection</span>
                            </li>
                            <li class={progressStep2Class}>
                                <div class="wizard-progress-marker"></div>
                                <span class="wizard-progress-label">General info setup</span>
                            </li>
                            <li class={progressStep3Class}>
                                <div class="wizard-progress-marker"></div>
                                <span class="wizard-progress-label">Match rule config</span>
                            </li>
                            <li class={progressStep4Class}>
                                <div class="wizard-progress-marker"></div>
                                <span class="wizard-progress-label">Reconciliation rule config</span>
                            </li>
                            <li class={progressStep5Class}>
                                <div class="wizard-progress-marker"></div>
                                <span class="wizard-progress-label">Trusted source (optional)</span>
                            </li>
                            <li class={progressStep6Class}>
                                <div class="wizard-progress-marker"></div>
                                <span class="wizard-progress-label">Filters (optional)</span>
                            </li>
                        </ol>
                    </div>
                    <div class="canvas-detail-panel">
                        <div class="canvas-content-card">
                        <div class="canvas-detail-panel__content">
                    <div class="determine-new-layout">
                        <!-- Left: entity type cards + other unification types -->
                        <div class="determine-new-left">
                            <h3 class="step1-section__title slds-m-bottom_x-small">What records would you like to consolidate?</h3>
                            <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_x-small">Choose the type of entity you want to resolve and unify into a single profile.</p>
                            <a href="#" class="determine-tell-more" onclick={handlePreventDefault}>Tell Me More</a>
                            <!-- 3 horizontal entity type cards -->
                            <div class="determine-entity-cards">
                                <div class={individualPickerClass}>
                                    <template lwc:if={isIndividualPickerSelected}>
                                        <div class="visual-picker-checkmark">
                                            <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                        </div>
                                    </template>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Individuals</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Unify individual customer records</p>
                                    </div>
                                </div>
                                <div class={householdPickerClass}>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Households</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Consolidate household-level records</p>
                                    </div>
                                </div>
                                <div class={accountPickerClass}>
                                    <div class="slds-p-around_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Accounts</h3>
                                        <p class="slds-text-body_small slds-text-color_weak">Merge business account records</p>
                                    </div>
                                </div>
                            </div>
                            <!-- Other Unification Types -->
                            <div class="determine-other-types">
                                <h4 class="determine-other-types__heading">Other Unification Types</h4>
                                <div class="determine-other-types__body">
                                    <p class="slds-text-body_small slds-text-color_weak">None yet, but this option is possible for you if you did xyz. <a href="#" onclick={handlePreventDefault}>Learn More</a></p>
                                </div>
                            </div>
                        </div>
                        <!-- Right: info sidebar -->
                        <div class="determine-new-sidebar">
                            <div class="determine-picker-detail">
                                <h4 class="determine-detail__heading slds-m-bottom_medium">Unify Unmatched Records</h4>
                                <div class="determine-detail__section">
                                    <p class="determine-detail__label">What this means</p>
                                    <p class="slds-text-body_small slds-text-color_weak">Identity Resolution scans your Data Cloud data sources for duplicate records and consolidates them into a single unified profile per customer.</p>
                                </div>
                                <div class="determine-detail__section">
                                    <p class="determine-detail__label">Setup steps</p>
                                    <p class="slds-text-body_small slds-text-color_weak">Configure general details, a match strategy, and optional reconciliation rules, trusted sources, and filters.</p>
                                </div>
                                <div class="determine-detail__section">
                                    <p class="determine-detail__label">Best for</p>
                                    <p class="slds-text-body_small slds-text-color_weak">Organizations ingesting customer data from multiple disconnected sources that need a single source of truth.</p>
                                </div>
                                <div class="determine-detail__section">
                                    <p class="determine-detail__label">Expected outcome</p>
                                    <p class="slds-text-body_small slds-text-color_weak">A unified profile for each unique individual that aggregates data from all matching source records.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                        <div class="canvas-detail-panel__footer">
                            <lightning-button label="Cancel" variant="neutral" onclick={handleDetermineCancel}></lightning-button>
                            <span class="wizard-panel__footer-progress">Step 1 of 7</span>
                            <div class="wizard-panel__footer-spacer"></div>
                            <lightning-button label="Next" variant="brand" onclick={handleDetermineNext}></lightning-button>
                        </div>
                        </div><!-- end canvas-content-card -->
                    </div><!-- end canvas-detail-panel -->
                </div><!-- end wizard-canvas-body -->
            </div><!-- end wizard-canvas-layout -->
        </template>

        <!-- Loading state (3-second spinner after Next from Determine) -->
        <template lwc:if={isLoadingTask}>
            <!-- Loading spinner panel -->
            <div class="qsl-panel-host wizard-panel">
                <div class="qsl-panel__header qsl-panel__header_gray">
                    <div>
                        <h2 class="qsl-panel__title">Setting Up Your Ruleset</h2>
                        <p class="qsl-panel__description">Configuring your ruleset based on your selections...</p>
                    </div>
                </div>
                <div class="qsl-panel__content task-loading-content">
                    <div class="task-loading-spinner">
                        <div class="slds-spinner_container">
                            <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                            </div>
                        </div>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-top_large">Preparing your configuration...</p>
                    </div>
                </div>
            </div>
        </template>

        <!-- Main Content Area -->
        <div class={mainPanelClass} lwc:if={showPanelContent}>

            <!-- Canvas-page header -->
            <div class="canvas-page__header">
                <div class="canvas-page__header-inner">
                    <div class="canvas-page__heading">
                        <p class="canvas-page__eyebrow">Identity Resolution</p>
                        <h1 class="canvas-page__title">Create New Ruleset</h1>

                                                                        <ui-badge-with-tooltip class="slds-m-left_x-small" heading="Why AI selected Automatic" body="Automatic is the most common choice for production rulesets. It ensures unified profiles stay up-to-date as new data arrives without requiring manual intervention."></ui-badge-with-tooltip>
                                                                    </div>
                                                                    <p class="slds-text-body_small slds-text-color_weak">Salesforce automatically schedules and runs identity resolution jobs on a set cadence. Jobs start as soon as your ruleset is activated and run continuously on your chosen schedule.</p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-2">
                                                        <div class={manualCardClass} onclick={handleSelectManual} style="cursor:pointer;position:relative;">
                                                            <template lwc:if={isManualMode}>
                                                                <span class="visual-picker-checkmark">
                                                                    <lightning-icon icon-name="utility:check" size="x-small" style="--slds-c-icon-color-foreground-default:#ffffff;"></lightning-icon>
                                                                </span>
                                                            </template>
                                                            <div class="slds-media">
                                                                <div class="slds-media__body">
                                                                    <h3 class="slds-text-title_caps slds-text-color_default slds-m-bottom_x-small">Manual</h3>
                                                                    <p class="slds-text-body_small slds-text-color_weak">You control when jobs run. Trigger identity resolution manually from the record home or via API. Useful when you want to batch runs or run only when data changes significantly.</p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="slds-modal__footer">
                                                <lightning-button label="Cancel" variant="neutral" onclick={handleJobRunModalCancel}></lightning-button>
                                                <lightning-button label="Save" variant="brand" onclick={handleJobRunModalSave}></lightning-button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                </lightning-tab>

                                <lightning-tab label="Profile Explorer" value="profileExplorer">
                                    <!-- Filter bar -->
                                    <div class="profile-explorer-filters">
                                        <lightning-combobox label="" placeholder="Select Data Space" options={jobScheduleFrequencyOptions} variant="label-hidden" class="profile-explorer-filter-item"></lightning-combobox>
                                        <lightning-combobox label="" placeholder="Select an Option" options={jobScheduleFrequencyOptions} variant="label-hidden" class="profile-explorer-filter-item"></lightning-combobox>
                                        <lightning-combobox label="" placeholder="Select Attribute" options={jobScheduleFrequencyOptions} variant="label-hidden" class="profile-explorer-filter-item"></lightning-combobox>
                                        <div class="profile-explorer-search">
                                            <lightning-input label="" placeholder="Search" type="search" variant="label-hidden"></lightning-input>
                                        </div>
                                    </div>
                                    <!-- Empty state -->
                                    <div class="profile-explorer-empty">
                                        <img src="/images/empty-state-tasks.svg" alt="" class="profile-explorer-empty__illustration" />
                                        <p class="profile-explorer-empty__label">Select Object</p>
                                    </div>
                                </lightning-tab>
                                <lightning-tab label="Processing History" value="history">
                                <div class="oc-section">
                                    <!-- Header row -->
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                        <div>
                                            <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">Ruleset History</h2>
                                            <p class="slds-text-body_small slds-text-color_weak">This log includes all changes to your ruleset and ruleset runs. Incremental runs are grouped if multiple runs happen within the same period.</p>
                                        </div>
                                        <div class="slds-col_bump-left slds-grid slds-grid_vertical-align-center">
                                            <lightning-button label="Download" variant="neutral" icon-name="utility:download" icon-position="left" class="slds-m-right_small"></lightning-button>
                                            <lightning-input type="search" label="Search" variant="label-hidden" placeholder="Search..." class="slds-m-right_x-small"></lightning-input>
                                            <lightning-button-icon icon-name="utility:filterList" variant="border-filled" alternative-text="Filter"></lightning-button-icon>
                                        </div>
                                    </div>

                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout ruleset-history-table">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col" style="width: 3rem;"></th>
                                                <th scope="col">
                                                    <div class="slds-truncate">Date &amp; Time Duration
                                                        <lightning-helptext content="Date and time of the job run, and its duration." icon-name="utility:info"></lightning-helptext>
                                                    </div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate">Run Reason
                                                        <lightning-helptext content="What triggered this run." icon-name="utility:info"></lightning-helptext>
                                                    </div>
                                                </th>
                                                <th scope="col"><div class="slds-truncate">Total Source Profiles</div></th>
                                                <th scope="col"><div class="slds-truncate">Total Unified Profiles</div></th>
                                                <th scope="col"><div class="slds-truncate">Total Known Records</div></th>
                                                <th scope="col"><div class="slds-truncate">Filtered Records</div></th>
                                                <th scope="col"><div class="slds-truncate">Processed Records</div></th>
                                                <th scope="col"><div class="slds-truncate">Consolidatio...</div></th>
                                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                                <th scope="col"><div class="slds-truncate">Job ID</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={rulesetHistoryList} for:item="row">
                                                <tr key={row.id} class="slds-hint-parent">
                                                    <td>
                                                        <lightning-button-icon icon-name="utility:chevronright" variant="bare" size="small" alternative-text="Expand"></lightning-button-icon>
                                                    </td>
                                                    <td>
                                                        <div class="slds-truncate">{row.dateTime}</div>
                                                        <div class="slds-text-body_small slds-text-color_weak">{row.duration}</div>
                                                    </td>
                                                    <td><div class="slds-truncate">{row.runReason}</div></td>
                                                    <td><div class="slds-truncate">{row.totalSourceProfiles}</div></td>
                                                    <td><div class="slds-truncate">{row.totalUnifiedProfiles}</div></td>
                                                    <td><div class="slds-truncate">{row.totalKnownRecords}</div></td>
                                                    <td><div class="slds-truncate">{row.filteredRecords}</div></td>
                                                    <td><div class="slds-truncate">{row.processedRecords}</div></td>
                                                    <td><div class="slds-truncate">{row.consolidationRate}</div></td>
                                                    <td>
                                                        <template lwc:if={row.isSucceeded}>
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="utility:success" size="x-small" variant="success" class="slds-m-right_xx-small"></lightning-icon>
                                                                <span class="slds-text-color_success">Succeeded</span>
                                                            </div>
                                                        </template>
                                                        <template lwc:elseif={row.isWarning}>
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_xx-small status-warning"></lightning-icon>
                                                                <span class="status-warning">{row.statusLabel}</span>
                                                            </div>
                                                        </template>
                                                        <template lwc:elseif={row.isError}>
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                                                                <span class="slds-text-color_error">{row.statusLabel}</span>
                                                            </div>
                                                        </template>
                                                    </td>
                                                    <td><div class="slds-truncate slds-text-color_weak">{row.jobId}</div></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                </lightning-tab>
                            </lightning-tabset>
                        </div>

                        <!-- Right: resolution summary widget -->
                        <div class="oc-sidebar-col">
                            <div class="oc-resolution-summary">
                                <h3 class="oc-resolution-summary__title">Resolution Summary</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Last Updated 06/25/2026</p>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Total Unified Profiles</span>
                                        <span class="oc-summary-stat__value">435K</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">/ 580K Source Profiles</p>
                                </div>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Consolidation Rate</span>
                                        <span class="oc-summary-stat__value">75%</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">The number of source profiles that match another</p>
                                </div>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Matched Source Profiles</span>
                                        <span class="oc-summary-stat__value">435K</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">The number of source profiles that match another</p>
                                </div>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Known Unified Profiles</span>
                                        <span class="oc-summary-stat__value">370K</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">The number of unified profiles with known identity</p>
                                </div>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Anonymous Unified Profiles</span>
                                        <span class="oc-summary-stat__value">65K</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">The number of unified profiles without known identity</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

    </div><!-- end full-height-grid -->

    <!-- Floating design version toggle — only on setup Step 1 -->
    <template lwc:if={showVersionToggle}>
        <div class="scenario-fab">
            <span class="scenario-fab__label">Design</span>
            <div class="scenario-fab__pills">
                <button class={scenario1BtnClass} onclick={handleScenario1}>V1</button>
                <button class={scenario2BtnClass} onclick={handleScenario2}>V2</button>
            </div>
        </div>
    </template>

</template>
