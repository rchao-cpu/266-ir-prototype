<template>
    <!-- Success Notification (Top of Page) -->
    <template lwc:if={showSuccessNotification}>
        <div class="slds-notify_container slds-is-relative" style="position: fixed; top: 0; left: 0; right: 0; z-index: 10000;">
            <div class="slds-notify slds-notify_toast slds-theme_success" role="status">
                <span class="slds-assistive-text">Success</span>
                <span class="slds-icon_container slds-icon-utility-success slds-m-right_small slds-no-flex slds-align-top">
                    <lightning-icon icon-name="utility:success" size="small" variant="inverse" alternative-text="Success"></lightning-icon>
                </span>
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small">{successMessage}</h2>
                </div>
                <div class="slds-notify__close">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        alternative-text="Close"
                        title="Close"
                        onclick={handleCloseNotification}>
                    </lightning-button-icon>
                </div>
            </div>
        </div>
    </template>

    <div class="slds-grid slds-wrap full-height-grid">
        <!-- Side Navigation -->
        <div class="slds-col side-nav-container" lwc:if={showSideNav}>
            <div class="side-nav-content">
                <lightning-input
                    type="search"
                    label="Quick Find"
                    variant="label-hidden"
                    placeholder="Quick Find"
                    class="slds-p-around_medium">
                </lightning-input>

                <nav class="slds-nav-vertical slds-nav-vertical_shade" aria-label="Sub page">
                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:filter" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Connect & Unify</span>
                            <lightning-button-icon
                                icon-name="utility:chevrondown"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                        <ul>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Streams</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Lake Objects</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Transforms</a>
                            </li>
                            <li class="slds-nav-vertical__item">
                                <a href="#" class="slds-nav-vertical__action">Data Model</a>
                            </li>
                            <li class="slds-nav-vertical__item slds-is-active">
                                <a href="#" class="slds-nav-vertical__action" aria-current="page" onclick={handleGoToLandingPage}>Identity Resolution</a>
                            </li>
                        </ul>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:shield" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Govern & Secure</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:transform" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Process & Enrich</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:metrics" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Explore & Optimize</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:graph" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Analyze & Predict</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>

                    <div class="slds-nav-vertical__section">
                        <h2 class="slds-nav-vertical__title">
                            <lightning-icon icon-name="utility:clock" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span style="flex: 1;">Segment & Act</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                variant="bare"
                                alternative-text="Expand section">
                            </lightning-button-icon>
                        </h2>
                    </div>
                </nav>
            </div>

            <div class="side-nav-footer">
                <lightning-button
                    label="Collapse"
                    icon-name="utility:back"
                    icon-position="left"
                    variant="base"
                    class="slds-button_stretch"
                    onclick={handleCollapseSideNav}>
                </lightning-button>
            </div>
        </div>

        <!-- Expand Button (when collapsed) -->
        <template lwc:if={showExpandButton}>
            <div class="slds-col slds-size_1-of-12 slds-p-right_small">
                <lightning-button
                    icon-name="utility:forward"
                    variant="neutral"
                    title="Expand Navigation"
                    onclick={handleExpandSideNav}>
                </lightning-button>
            </div>
        </template>

        <!-- Landing Page Content -->
        <template lwc:if={showLandingPage}>
            <div class="slds-col landing-page-wrapper">
                <div class="landing-page-container">
                    <!-- EOU Guidance Header -->
                    <div class="guidance-header slds-m-bottom_medium">
                        <template lwc:if={guidanceExpanded}>
                            <div class="guidance-header-expanded">
                                <div class="guidance-header-title-row" onclick={handleGuidanceToggle}>
                                    <lightning-icon icon-name="utility:chevrondown" size="x-small" class="chevron-icon"></lightning-icon>
                                    <h2 class="guidance-header-title-expanded">Identity Resolution</h2>
                                </div>
                                <div class="guidance-header-content guidance-header-content--no-card">
                                    <p class="guidance-header-description guidance-header-description--no-card">Configure how customer profiles from different sources are matched and unified into a single identity. Set up match rules, reconciliation logic, and trusted data sources.</p>
                                    <div class="guidance-header-links guidance-header-links--column">
                                        <a href="#" class="guidance-header-link">Identity Resolution Overview <lightning-icon icon-name="utility:new_window" size="xx-small" class="external-icon"></lightning-icon></a>
                                        <a href="#" class="guidance-header-link">Match Rule Best Practices <lightning-icon icon-name="utility:new_window" size="xx-small" class="external-icon"></lightning-icon></a>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="guidance-header-collapsed" onclick={handleGuidanceToggle}>
                                <lightning-icon icon-name="utility:chevronright" size="x-small" class="chevron-icon"></lightning-icon>
                                <h2 class="guidance-header-title-collapsed">Identity Resolution</h2>
                            </div>
                        </template>
                    </div>

                    <!-- Page Header -->
                    <div class="slds-page-header slds-m-bottom_large">
                        <div class="slds-page-header__row">
                            <div class="slds-page-header__col-title">
                                <div class="slds-media">
                                    <div class="slds-media__figure slds-m-right_small">
                                        <lightning-icon icon-name="standard:individual" size="medium"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <p class="header-label">SETUP</p>
                                        <h1 class="custom-header" title="Identity Resolution">Identity Resolution</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Route Selection (hidden once a ruleset has been created) -->
                    <template lwc:if={showCreateRuleset}>
                    <div class="slds-m-top_medium slds-m-bottom_small"></div>
                    <lightning-card>
                        <div class="slds-p-around_medium">
                            <h2 class="slds-text-heading_medium slds-text-align_center slds-m-bottom_small">Create your first Ruleset to merge your customer profiles</h2>
                            <p class="slds-text-body_small slds-text-align_center slds-m-bottom_large">Select how you want to create your ruleset</p>

                            <!-- Empty state illustration -->
                            <div class="plan-empty-state">
                                <div class="slds-illustration slds-illustration_small">
                                    <img src="/images/empty-state-tasks.svg" class="slds-illustration__svg" alt="" />
                                    <div class="slds-text-longform">
                                        <p class="slds-text-body_regular slds-text-color_weak">No rulesets yet. Use Begin to create your first ruleset.</p>
                                    </div>
                                </div>

                                <!-- Begin button with dropdown -->
                                <div class="slds-button-group plan-begin-trigger" onclick={handleBeginDropdownToggle}>
                                    <lightning-button
                                        label="Begin"
                                        variant="brand"
                                        onclick={handleBeginClick}>
                                    </lightning-button>
                                    <button class="slds-button slds-button_brand slds-button_last plan-begin-chevron" type="button" aria-haspopup="listbox" aria-expanded={isBeginDropdownOpen}>
                                        <lightning-icon icon-name="utility:down" size="x-small" variant="inverse"></lightning-icon>
                                    </button>

                                    <!-- Dropdown listbox -->
                                    <template lwc:if={isBeginDropdownOpen}>
                                        <div class="slds-dropdown plan-begin-dropdown" role="listbox">
                                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                            <li role="presentation" class="slds-listbox__item">
                                                <span class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" role="option" data-route="unify" onclick={handleRouteDropdownSelect}>
                                                    <span class="slds-media__figure slds-listbox__option-icon">
                                                        <lightning-icon icon-name="utility:merge" size="x-small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-media__body">
                                                        <span class="slds-truncate">Unify Unmatched Records
                                                            <lightning-badge label="Recommended" class="slds-m-left_x-small"></lightning-badge>
                                                        </span>
                                                    </span>
                                                </span>
                                            </li>
                                            <li role="presentation" class="slds-listbox__item">
                                                <span class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" role="option" data-route="mdm" onclick={handleRouteDropdownSelect}>
                                                    <span class="slds-media__figure slds-listbox__option-icon">
                                                        <lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-media__body">
                                                        <span class="slds-truncate">Import MDM</span>
                                                    </span>
                                                </span>
                                            </li>
                                            <li role="presentation" class="slds-listbox__item">
                                                <span class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" role="option" data-route="datakit" onclick={handleRouteDropdownSelect}>
                                                    <span class="slds-media__figure slds-listbox__option-icon">
                                                        <lightning-icon icon-name="utility:package" size="x-small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-media__body">
                                                        <span class="slds-truncate">Import from Data Kits</span>
                                                    </span>
                                                </span>
                                            </li>
                                        </ul>
                                    </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </lightning-card>
                    </template>

                    <!-- Ruleset List (only after a ruleset has been created) -->
                    <template lwc:if={showRulesetList}>
                    <div class="slds-m-top_medium slds-m-bottom_small"></div>
                    <lightning-card>
                        <div class="slds-p-around_medium">
                            <div class="slds-m-bottom_large">
                                <h2 class="slds-text-heading_medium">Ruleset List</h2>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">List of rulesets created and analytics of it for users to see</p>
                            </div>

                            <template for:each={rulesetList} for:item="ruleset">
                                <div key={ruleset.id} class="ruleset-card slds-m-bottom_large">
                                    <!-- Card Header -->
                                    <div class="ruleset-card-header">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <lightning-icon icon-name="standard:groups" size="small" class="slds-m-right_small"></lightning-icon>
                                            <div>
                                                <h3 class="slds-text-heading_small">{ruleset.name}</h3>
                                                <span class="slds-text-body_small slds-text-color_weak">{ruleset.entityType} · Last run: {ruleset.lastRun}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Stat Strip -->
                                    <div class="ruleset-stat-strip">
                                        <div class="ruleset-stat">
                                            <div class="ruleset-stat-value ruleset-stat-value_brand">{ruleset.profilesMerged}</div>
                                            <div class="ruleset-stat-label">Profiles Merged</div>
                                        </div>
                                        <div class="ruleset-stat-divider"></div>
                                        <div class="ruleset-stat">
                                            <div class="ruleset-stat-value">{ruleset.sourceRecords}</div>
                                            <div class="ruleset-stat-label">Source Records</div>
                                        </div>
                                        <div class="ruleset-stat-divider"></div>
                                        <div class="ruleset-stat">
                                            <div class="ruleset-stat-value">{ruleset.consolidationRate}</div>
                                            <div class="ruleset-stat-label">Consolidation Rate</div>
                                        </div>
                                        <div class="ruleset-stat-divider"></div>
                                        <div class="ruleset-stat">
                                            <div class="ruleset-stat-value">{ruleset.matchQuality}</div>
                                            <div class="ruleset-stat-label">Match Quality</div>
                                        </div>
                                        <div class="ruleset-stat-divider"></div>
                                        <div class="ruleset-stat">
                                            <div class="ruleset-stat-value">{ruleset.matchRules}</div>
                                            <div class="ruleset-stat-label">Match Rules</div>
                                        </div>
                                        <div class="ruleset-stat-divider"></div>
                                        <div class="ruleset-stat">
                                            <div class="ruleset-stat-value">{ruleset.creditsUsed}</div>
                                            <div class="ruleset-stat-label">Credits Used</div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </lightning-card>
                    </template>
                </div>
            </div>
        </template>

        <!-- Step Navigation -->
        <div class="slds-col slds-p-horizontal_small step-nav-column" lwc:if={showStepNavColumn}>
            <div class="step-nav-header">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                    <h2 class="slds-text-heading_small">Identity Resolution</h2>
                    <lightning-button
                        label="Agent Help"
                        variant="neutral"
                        onclick={handleOpenChat}>
                    </lightning-button>
                </div>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Sequential guided experience</p>
            </div>

            <!-- Group: Required Setup -->
            <template lwc:if={showOptionalSteps}>
                <p class="step-section-header slds-m-bottom_x-small">Required Setup</p>
            </template>

            <!-- Step 1: General Details -->
            <article class={step1CardClass} data-step="1" onclick={handleStepClick}>
                <div class="step-card-content">
                    <div class="step-card-body">
                        <h4 class="step-card-title">General Details</h4>
                        <p class="step-card-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</p>
                    </div>
                </div>
            </article>

            <!-- Step 2: Job Schedule -->
            <article class={step2CardClass} data-step="2" onclick={handleStepClick}>
                <div class="step-card-content">
                    <div class="step-card-body">
                        <h4 class="step-card-title">Job Schedule</h4>
                        <p class="step-card-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</p>
                    </div>
                </div>
            </article>

            <!-- Step 3: Trusted Sources — Required Setup when Import MDM -->
            <template lwc:if={step2Required}>
                <article class={step3CardClass} data-step="3" onclick={handleStepClick}>
                    <div class="step-card-content">
                        <div class="step-card-body">
                            <h4 class="step-card-title">Trusted Sources</h4>
                            <p class="step-card-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</p>
                        </div>
                    </div>
                </article>
            </template>

            <!-- Group: Optional Configurations (hidden in edit mode) -->
            <template lwc:if={showOptionalSteps}>
                <p class="step-section-header slds-m-top_medium slds-m-bottom_x-small">Optional Configurations</p>

                <!-- Step 3: Trusted Sources — Optional when not Import MDM -->
                <template lwc:if={showTrustedSourcesAsOptional}>
                    <article class={step3CardClass} data-step="3" onclick={handleStepClick}>
                        <div class="step-card-content">
                            <div class="step-card-body">
                                <h4 class="step-card-title">Trusted Sources</h4>
                                <p class="step-card-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</p>
                            </div>
                        </div>
                    </article>
                </template>

                <!-- Steps 4–6 hidden for MDM import -->
                <template lwc:if={showMatchReconSteps}>
                    <!-- Step 4: Generate Match Rules -->
                    <article class={step4CardClass} data-step="4" onclick={handleStepClick}>
                        <div class="step-card-content">
                            <div class="step-card-body">
                                <h4 class="step-card-title">Generate Match Rules</h4>
                                <p class="step-card-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</p>
                            </div>
                        </div>
                    </article>

                    <!-- Step 5: Generate Reconciliation Rules -->
                    <article class={step5CardClass} data-step="5" onclick={handleStepClick}>
                        <div class="step-card-content">
                            <div class="step-card-body">
                                <h4 class="step-card-title">Generate Reconciliation Rules</h4>
                                <p class="step-card-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</p>
                            </div>
                        </div>
                    </article>

                    <!-- Step 6: Set Up Filters -->
                    <article class={step6CardClass} data-step="6" onclick={handleStepClick}>
                        <div class="step-card-content">
                            <div class="step-card-body">
                                <h4 class="step-card-title">Set Up Filters</h4>
                                <p class="step-card-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</p>
                            </div>
                        </div>
                    </article>
                </template>
            </template>

        </div>

        <!-- Main Content Area -->
        <div class="slds-col slds-p-horizontal_small main-content-area" lwc:if={showStepNavAndContent}>
            <div class="step-content-scroll">
            <!-- Selected Route Header -->
            <template lwc:if={selectedRoute}>
                <div class="slds-page-header slds-m-bottom_medium">
                    <div class="slds-page-header__row">
                        <div class="slds-page-header__col-title">
                            <div class="slds-media">
                                <div class="slds-media__body">
                                    <p class="header-label">{stepPageHeaderLabel}</p>
                                    <h1 class="custom-header" title={stepPageHeaderTitle}>{stepPageHeaderTitle}</h1>
                                </div>
                            </div>
                        </div>
                        <template lwc:if={isStep4}>
                        <div class="slds-page-header__col-actions slds-col_bump-left">
                            <lightning-button
                                label="Preview Results"
                                variant="neutral"
                                icon-name="utility:preview"
                                icon-position="left"
                                onclick={handlePreviewResults}>
                            </lightning-button>
                        </div>
                        </template>
                    </div>
                </div>
            </template>

            <div class="slds-p-around_medium">
                <div>
                    <!-- Step 1: General Details & Basic Details (Combined) -->
                    <template lwc:if={isStep1}>
                        <!-- Recommendation Notification -->
                        <template lwc:if={showRecommendationBanners}>
                        <div class="slds-scoped-notification slds-media slds-media_center slds-theme_info slds-m-bottom_medium" role="status">
                            <div class="slds-media__figure">
                                <span class="slds-icon_container" title="Recommendation">
                                    <lightning-icon icon-name="utility:magicwand" size="small" alternative-text="Recommendation"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                        <p><strong>We recommend "Individual"</strong> for you because lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                                        <a href="#" class="slds-text-link slds-shrink-none slds-m-left_medium" onclick={handleLearnMore}>Learn more</a>
                                </div>
                            </div>
                        </div>
                        </template>

                        <!-- Section: What records will this ruleset consolidate? (hidden in edit mode) -->
                        <template lwc:if={showRecommendationBanners}>
                        <div class="step1-section">
                            <h3 class="step1-section__title">What records will this ruleset consolidate?</h3>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">Choose the entity type you want to create unified records for</p>

                            <lightning-layout multiple-rows>
                                <lightning-layout-item size="4" padding="around-small">
                                    <div class={individualPickerClass}>
                                        <template lwc:if={isIndividualPickerSelected}>
                                        <div class="visual-picker-checkmark">
                                            <lightning-icon icon-name="utility:check" size="small" variant="inverse"></lightning-icon>
                                        </div>
                                        </template>
                                        <div class="slds-p-around_medium">
                                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                Individual
                                                <lightning-badge label="Recommended" class="slds-m-left_x-small"></lightning-badge>
                                            </h3>
                                            <p class="slds-text-body_small slds-text-color_weak">Create unified person profiles across your data sources</p>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                                <lightning-layout-item size="4" padding="around-small">
                                    <div class={pickerDisabledClass}>
                                        <div class="slds-p-around_medium">
                                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Account</h3>
                                            <p class="slds-text-body_small slds-text-color_weak">Create unified business/company profiles</p>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                                <lightning-layout-item size="4" padding="around-small">
                                    <div class={pickerDisabledClass}>
                                        <div class="slds-p-around_medium">
                                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Household</h3>
                                            <p class="slds-text-body_small slds-text-color_weak">Group individuals into household units</p>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                            </lightning-layout>
                        </div>
                        </template>

                        <!-- Section: General Details -->
                        <div class="step1-section slds-m-top_large">

                                        <template lwc:if={isCpPhoneExpanded}>
                                            <div class="recon-dmo-row__fields">
                                                <div class="recon-dmo-row__fields-actions">
                                                    <lightning-button label="Edit" variant="neutral" icon-name="utility:edit" icon-position="left" size="small"></lightning-button>
                                                    <lightning-button label="Reset to Default" variant="neutral" icon-name="utility:undo" icon-position="left" size="small"></lightning-button>
                                                </div>
                                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout recon-fields-table">
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th scope="col"><div class="slds-truncate">Field Name</div></th>
                                                            <th scope="col"><div class="slds-truncate">Field API Name</div></th>
                                                            <th scope="col"><div class="slds-truncate">Reconciliation Method</div></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr>
                                                            <td><div class="slds-truncate">Phone Type</div></td>
                                                            <td><div class="slds-truncate">PhoneType</div></td>
                                                            <td><lightning-badge label="Most Frequent" class="recon-badge recon-badge_frequent"></lightning-badge></td>
                                                        </tr>
                                                        <tr>
                                                            <td><div class="slds-truncate">Phone Number</div></td>
                                                            <td><div class="slds-truncate">TelephoneNumber</div></td>
                                                            <td><lightning-badge label="Most Recent" class="recon-badge recon-badge_recent"></lightning-badge></td>
                                                        </tr>
                                                        <tr>
                                                            <td><div class="slds-truncate">Country Code</div></td>
                                                            <td><div class="slds-truncate">CountryDialingCode</div></td>
                                                            <td><lightning-badge label="Most Recent" class="recon-badge recon-badge_recent"></lightning-badge></td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                    </div>
                                    <!-- DMO: Contact Point Address -->
                                    <div class="recon-dmo-row" data-dmo="cpAddress" onclick={handleReconDmoToggle}>
                                        <div class="recon-dmo-row__header">
                                            <div class="recon-dmo-row__left">
                                                <lightning-icon icon-name={cpAddressChevron} size="x-small" class="recon-dmo-row__chevron"></lightning-icon>
                                                <span class="recon-dmo-row__name">Contact Point Address</span>
                                                <span class="recon-dmo-row__field-count slds-text-body_small slds-text-color_weak">4 fields</span>
                                                <div class="recon-dmo-row__meta">
                                                    <span class="slds-text-body_small slds-text-color_weak">Default:</span>
                                                    <lightning-badge label="Most Recent" class="recon-badge recon-badge_recent slds-m-left_x-small"></lightning-badge>
                                                </div>
                                            </div>
                                        </div>
                                        <template lwc:if={isCpAddressExpanded}>
                                            <div class="recon-dmo-row__fields">
                                                <div class="recon-dmo-row__fields-actions">
                                                    <lightning-button label="Edit" variant="neutral" icon-name="utility:edit" icon-position="left" size="small"></lightning-button>
                                                    <lightning-button label="Reset to Default" variant="neutral" icon-name="utility:undo" icon-position="left" size="small"></lightning-button>
                                                </div>
                                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout recon-fields-table">
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th scope="col"><div class="slds-truncate">Field Name</div></th>
                                                            <th scope="col"><div class="slds-truncate">Field API Name</div></th>
                                                            <th scope="col"><div class="slds-truncate">Reconciliation Method</div></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr>
                                                            <td><div class="slds-truncate">Street</div></td>
                                                            <td><div class="slds-truncate">Street</div></td>
                                                            <td><lightning-badge label="Most Frequent" class="recon-badge recon-badge_frequent"></lightning-badge></td>
                                                        </tr>
                                                        <tr>
                                                            <td><div class="slds-truncate">City</div></td>
                                                            <td><div class="slds-truncate">City</div></td>
                                                            <td><lightning-badge label="Most Recent" class="recon-badge recon-badge_recent"></lightning-badge></td>
                                                        </tr>
                                                        <tr>
                                                            <td><div class="slds-truncate">State</div></td>
                                                            <td><div class="slds-truncate">State</div></td>
                                                            <td><lightning-badge label="Most Recent" class="recon-badge recon-badge_recent"></lightning-badge></td>
                                                        </tr>
                                                        <tr>
                                                            <td><div class="slds-truncate">Postal Code</div></td>
                                                            <td><div class="slds-truncate">PostalCode</div></td>
                                                            <td><lightning-badge label="Most Recent" class="recon-badge recon-badge_recent"></lightning-badge></td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                    </div>
                                    </div><!-- end recon-rules-list -->
                                </div>

                                <!-- Trusted Data Sources -->
                                <div class="oc-section slds-m-bottom_medium">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_medium">
                                        <h2 class="slds-text-heading_small">Trusted Data Sources</h2>
                                        <div class="slds-col_bump-left">
                                            <lightning-button label="Edit" variant="neutral"></lightning-button>
                                        </div>
                                    </div>
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col" style="width: 35%"><div class="slds-truncate">DMO</div></th>
                                                <th scope="col" style="width: 65%"><div class="slds-truncate">Trusted Data Source</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td><div class="slds-truncate">Individual</div></td>
                                                <td><div class="slds-truncate">{individualDloLabel}</div></td>
                                            </tr>
                                            <tr>
                                                <td><div class="slds-truncate">Contact Point Address</div></td>
                                                <td><div class="slds-truncate">{contactPointAddressLabel}</div></td>
                                            </tr>
                                            <tr>
                                                <td><div class="slds-truncate">Contact Point App</div></td>
                                                <td><div class="slds-truncate">{contactPointAppLabel}</div></td>
                                            </tr>
                                            <tr>
                                                <td><div class="slds-truncate">Contact Point Email</div></td>
                                                <td><div class="slds-truncate">{contactPointEmailLabel}</div></td>
                                            </tr>
                                            <tr>
                                                <td><div class="slds-truncate">Contact Point Social</div></td>
                                                <td><div class="slds-truncate">{contactPointSocialLabel}</div></td>
                                            </tr>
                                            <tr>
                                                <td><div class="slds-truncate">Contact Point Phone</div></td>
                                                <td><div class="slds-truncate">{contactPointPhoneLabel}</div></td>
                                            </tr>
                                            <tr>
                                                <td><div class="slds-truncate">Party ID</div></td>
                                                <td><div class="slds-truncate">{partyIdLabel}</div></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                </lightning-tab>
                                <lightning-tab label="Processing History" value="history">
                                <div class="oc-section">
                                    <!-- Header row -->
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                        <div>
                                            <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">Ruleset History</h2>
                                            <p class="slds-text-body_small slds-text-color_weak">This log includes all changes to your ruleset and ruleset runs. Incremental runs are grouped if multiple runs happen within the same period.</p>
                                        </div>
                                        <div class="slds-col_bump-left slds-grid slds-grid_vertical-align-center">
                                            <lightning-button label="Download" variant="neutral" icon-name="utility:download" icon-position="left" class="slds-m-right_small"></lightning-button>
                                            <lightning-input type="search" label="Search" variant="label-hidden" placeholder="Search..." class="slds-m-right_x-small"></lightning-input>
                                            <lightning-button-icon icon-name="utility:filterList" variant="border-filled" alternative-text="Filter"></lightning-button-icon>
                                        </div>
                                    </div>

                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout ruleset-history-table">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col" style="width: 3rem;"></th>
                                                <th scope="col">
                                                    <div class="slds-truncate">Date &amp; Time Duration
                                                        <lightning-helptext content="Date and time of the job run, and its duration." icon-name="utility:info"></lightning-helptext>
                                                    </div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate">Run Reason
                                                        <lightning-helptext content="What triggered this run." icon-name="utility:info"></lightning-helptext>
                                                    </div>
                                                </th>
                                                <th scope="col"><div class="slds-truncate">Total Source Profiles</div></th>
                                                <th scope="col"><div class="slds-truncate">Total Unified Profiles</div></th>
                                                <th scope="col"><div class="slds-truncate">Total Known Records</div></th>
                                                <th scope="col"><div class="slds-truncate">Filtered Records</div></th>
                                                <th scope="col"><div class="slds-truncate">Processed Records</div></th>
                                                <th scope="col"><div class="slds-truncate">Consolidatio...</div></th>
                                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                                <th scope="col"><div class="slds-truncate">Job ID</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={rulesetHistoryList} for:item="row">
                                                <tr key={row.id} class="slds-hint-parent">
                                                    <td>
                                                        <lightning-button-icon icon-name="utility:chevronright" variant="bare" size="small" alternative-text="Expand"></lightning-button-icon>
                                                    </td>
                                                    <td>
                                                        <div class="slds-truncate">{row.dateTime}</div>
                                                        <div class="slds-text-body_small slds-text-color_weak">{row.duration}</div>
                                                    </td>
                                                    <td><div class="slds-truncate">{row.runReason}</div></td>
                                                    <td><div class="slds-truncate">{row.totalSourceProfiles}</div></td>
                                                    <td><div class="slds-truncate">{row.totalUnifiedProfiles}</div></td>
                                                    <td><div class="slds-truncate">{row.totalKnownRecords}</div></td>
                                                    <td><div class="slds-truncate">{row.filteredRecords}</div></td>
                                                    <td><div class="slds-truncate">{row.processedRecords}</div></td>
                                                    <td><div class="slds-truncate">{row.consolidationRate}</div></td>
                                                    <td>
                                                        <template lwc:if={row.isSucceeded}>
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="utility:success" size="x-small" variant="success" class="slds-m-right_xx-small"></lightning-icon>
                                                                <span class="slds-text-color_success">Succeeded</span>
                                                            </div>
                                                        </template>
                                                        <template lwc:elseif={row.isWarning}>
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_xx-small status-warning"></lightning-icon>
                                                                <span class="status-warning">{row.statusLabel}</span>
                                                            </div>
                                                        </template>
                                                        <template lwc:elseif={row.isError}>
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                                                                <span class="slds-text-color_error">{row.statusLabel}</span>
                                                            </div>
                                                        </template>
                                                    </td>
                                                    <td><div class="slds-truncate slds-text-color_weak">{row.jobId}</div></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                </lightning-tab>
                            </lightning-tabset>
                        </div>

                        <!-- Right: resolution summary widget -->
                        <div class="oc-sidebar-col">
                            <div class="oc-resolution-summary">
                                <h3 class="oc-resolution-summary__title">Resolution Summary</h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Last Updated 06/25/2026</p>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Total Unified Profiles</span>
                                        <span class="oc-summary-stat__value">435K</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">/ 580K Source Profiles</p>
                                </div>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Consolidation Rate</span>
                                        <span class="oc-summary-stat__value">75%</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">The number of source profiles that match another</p>
                                </div>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Matched Source Profiles</span>
                                        <span class="oc-summary-stat__value">435K</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">The number of source profiles that match another</p>
                                </div>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Known Unified Profiles</span>
                                        <span class="oc-summary-stat__value">370K</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">The number of unified profiles with known identity</p>
                                </div>

                                <div class="oc-summary-stat">
                                    <div class="oc-summary-stat__header">
                                        <span class="oc-summary-stat__label">Anonymous Unified Profiles</span>
                                        <span class="oc-summary-stat__value">65K</span>
                                    </div>
                                    <p class="oc-summary-stat__desc slds-text-color_weak">The number of unified profiles without known identity</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

    </div>

    <!-- Docked Footer (Step 3 initial setup) -->
    <template lwc:if={showStep3DockedFooter}>
        <div class="edit-docked-footer">
            <div class="edit-docked-footer__actions">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancelStep}>
                </lightning-button>
                <lightning-button
                    label="Create Ruleset"
                    variant="brand"
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </div>
    </template>

    <!-- Docked Footer (Edit Mode) -->
    <template lwc:if={isEditMode}>
        <div class="edit-docked-footer">
            <div class="edit-docked-footer__actions">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    class="slds-m-right_small"
                    onclick={handleEditCancel}>
                </lightning-button>
                <lightning-button
                    label="Save"
                    variant="brand"
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </div>
    </template>

    <!-- Scenario Toggle Widget -->
    <div class="scenario-fab">
        <div class="scenario-fab__label">Scenario</div>
        <div class="scenario-fab__pills">
            <button class={scenario1BtnClass} onclick={handleScenario1}>V1</button>
            <button class={scenario2BtnClass} onclick={handleScenario2}>V2</button>
        </div>
    </div>
</template>
